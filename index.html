      <div className="table-wrap">
        <table>
          <thead><tr><th>대상자</th><th>사례번호</th><th>지역</th><th>담당자</th><th>최근 신호</th><th>등록일</th></tr></thead>
          <tbody>
            {filtered.map(c=>{
              const sigs = state.signals.filter(s=>s.clientId===c.id && s.lifecycle!=='종결');
              const worst = sigs.sort((a,b)=>URGENCY[a.urgency].order-URGENCY[b.urgency].order)[0];
              return (
                <tr key={c.id} className="clickable" onClick={()=>setNav({screen:'client', params:{id:c.id}})}>
                  <td>{c.alias}</td>
                  <td className="mono">{c.caseNo}</td>
                  <td>{c.region}</td>
                  <td>{(state.caseworkers.find(w=>w.id===c.managerId)||{}).name || '미배정'}</td>
                  <td>{worst ? <UrgencyBadge level={worst.urgency}/> : <Badge tone="good">특이신호없음</Badge>}</td>
                  <td>{fmtDate(c.registeredAt)}</td>
                </tr>
              );
            })}
            {filtered.length===0 && <tr><td colSpan="6"><Empty>{q ? '검색 결과가 없습니다.' : '현재 담당자에게 배정된 대상자가 없습니다.'}</Empty></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================
   화면 3. 신규 대상자 등록 (단일 페이지)
   ============================================================ */
const REGION_OPTIONS = GU_LIST.map(g=>'광주 '+g.label);
const CONSENT_ITEMS = [
  {key:'privacy', label:'개인정보 수집·이용 동의'},
  {key:'ai', label:'AI 분석 활용 동의'},
  {key:'agency', label:'기관 연계 동의'},
  {key:'emergency', label:'비상 상황 연락 동의'},
];

function NewClientForm({state, setState, setNav, currentCaseworkerId}){
  const [caseNo] = useState(()=>genCaseNo(state.clients));
  const [form, setForm] = useState({name:'', birthYear:'', gender:'여', phone:'', nickname:'', region:REGION_OPTIONS[0], managerId: currentCaseworkerId});
  const [hasEmergency, setHasEmergency] = useState('없음');
  const [emergency, setEmergency] = useState({name:'', relation:'', phone:'', consent:false});
  const [consents, setConsents] = useState({privacy:false, ai:false, agency:false, emergency:false});
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(null); // {clientId}

  const phoneDigits = onlyDigits(form.phone);
  const dupClient = phoneDigits.length>=9 ? state.clients.find(c=>onlyDigits(c.phone)===phoneDigits) : null;

  const nicknameTrimmed = form.nickname.trim();
  const nicknameFull = nicknameTrimmed ? (nicknameTrimmed.endsWith('어르신') ? nicknameTrimmed : nicknameTrimmed+' 어르신') : '';
  const nicknameDup = nicknameFull && state.clients.some(c=>c.alias===nicknameFull);

  const birthYearOk = /^(18|19|20)\d{2}$/.test(form.birthYear.trim());
  const emergencyOk = hasEmergency==='없음' || (emergency.name.trim() && emergency.relation.trim() && onlyDigits(emergency.phone).length>=9);
  const requiredOk = form.name.trim() && birthYearOk && phoneDigits.length>=9 && nicknameTrimmed && form.region && form.managerId && emergencyOk;
  const canSubmit = requiredOk && !dupClient && !submitting;

  function finish(){
    if(!canSubmit) return;
    setSubmitting(true);
    const managerName = (state.caseworkers.find(w=>w.id===form.managerId)||{}).name || '생활지원사';
    const newClient = {
      id: uid('C'), caseNo, name: form.name, alias: nicknameFull, nickname: nicknameTrimmed,
      birthYear: Number(form.birthYear)||0, gender: form.gender, phone: form.phone,
      region: form.region, managerId: form.managerId,
      emergency: hasEmergency==='있음' ? {has:'있음', name:emergency.name, relation:emergency.relation, phone:emergency.phone, consent:emergency.consent} : {has:'없음'},
      consents: {...consents, date: isoDaysAgo(0)},
      registeredAt: isoDaysAgo(0), completeness: 100, dupChecked:true, status:'등록완료',
    };
    const newBaseline = emptyBaseline(newClient.id, managerName);
    setState(s=>({...s, clients:[...s.clients, newClient], baselines:[...s.baselines, newBaseline],
      audit:[...s.audit, {id:uid('LOG'), at:new Date().toISOString(), actor:managerName, action:'신규 대상자 등록', detail:newClient.caseNo}]}));
    setSubmitting(false);
    setDone({clientId:newClient.id});
  }

  if(done){
    return (
      <div>
        <div className="section-head"><h2>신규 대상자 등록</h2></div>
        <div className="card" style={{maxWidth:640}}>
          <p style={{fontWeight:600, color:'var(--good)', marginBottom:8}}>등록이 완료되었습니다. (사례번호 {caseNo})</p>
          <p className="small" style={{marginBottom:14}}>대상자 등록과 AI 분석 절차는 분리되어 있습니다. 첫 통화기록을 저장하면 그 내용을 바탕으로 AI 분석이 진행됩니다.</p>
          <div style={{display:'flex', gap:8}}>
            <button className="btn" onClick={()=>setNav({screen:'client', params:{id:done.clientId}})}>대상자 프로필 보기</button>
            <button className="btn btn--primary" onClick={()=>setNav({screen:'checkin', params:{clientId:done.clientId}})}>첫 통화기록 작성</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="section-head"><h2>신규 대상자 등록</h2></div>

      <div className="card" style={{maxWidth:720, marginBottom:16}}>
        <div className="dl" style={{fontWeight:600, marginBottom:10, fontSize:13}}>기본정보</div>
        <div className="form-grid">
          <div className="field"><label>사례번호</label><input type="text" className="mono" value={caseNo} readOnly disabled/></div>
          <div className="field"><label>이름</label><input type="text" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div>
          <div className="field"><label>출생연도</label><input type="text" placeholder="예: 1944" value={form.birthYear} onChange={e=>setForm({...form,birthYear:e.target.value})}/>
            {form.birthYear && !birthYearOk && <span className="hint" style={{display:'block', color:'var(--warn)'}}>4자리 연도(예: 1944)로 입력해 주세요.</span>}
          </div>
          <div className="field"><label>성별</label>
            <select value={form.gender} onChange={e=>setForm({...form,gender:e.target.value})}><option>여</option><option>남</option></select>
          </div>
          <div className="field"><label>전화번호</label><input type="text" placeholder="예: 010-1234-5678" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/></div>
          <div className="field"><label>닉네임</label><input type="text" placeholder="예: 은행나무" value={form.nickname} onChange={e=>setForm({...form,nickname:e.target.value})}/>
            {nicknameFull && <span className="hint" style={{display:'block'}}>등록될 표시명: {nicknameFull}</span>}
          </div>
          <div className="field"><label>지역</label>
            <select value={form.region} onChange={e=>setForm({...form,region:e.target.value})}>
              {REGION_OPTIONS.map(r=>(<option key={r} value={r}>{r}</option>))}
            </select>
          </div>
          <div className="field"><label>담당 생활지원사</label>
            <select value={form.managerId} onChange={e=>setForm({...form,managerId:e.target.value})}>
              {state.caseworkers.map(w=>(<option key={w.id} value={w.id}>{w.name}</option>))}
            </select>
          </div>
        </div>
        {nicknameDup && <p className="small" style={{marginTop:8, color:'var(--warn)'}}>이미 같은 닉네임을 사용하는 대상자가 있습니다. 다른 대상자와 혼동되지 않도록 닉네임 조정을 권장합니다.</p>}
        {dupClient && (
          <div className="small" style={{marginTop:8, color:'var(--danger)'}}>
            동일한 전화번호로 등록된 대상자가 있습니다: {dupClient.alias} ({dupClient.caseNo}). 신규 등록 대신 기존 프로필을 확인해 주세요.
            <div style={{marginTop:6}}><button className="btn btn--sm" onClick={()=>setNav({screen:'client', params:{id:dupClient.id}})}>기존 프로필 열기</button></div>
          </div>
        )}
        <p className="small" style={{marginTop:10}}>주민번호 전체와 불필요한 가족사는 수집하지 않습니다.</p>
      </div>

      <div className="card" style={{maxWidth:720, marginBottom:16}}>
        <div className="dl" style={{fontWeight:600, marginBottom:10, fontSize:13}}>비상연락망</div>
        <div className="field" style={{maxWidth:220, marginBottom:10}}>
          <label>비상연락망 여부</label>
          <select value={hasEmergency} onChange={e=>setHasEmergency(e.target.value)}><option>없음</option><option>있음</option></select>
        </div>
        {hasEmergency==='있음' && (<>
          <div className="form-grid">
            <div className="field"><label>비상연락 대상자 이름</label><input type="text" value={emergency.name} onChange={e=>setEmergency({...emergency,name:e.target.value})}/></div>
            <div className="field"><label>관계</label><input type="text" placeholder="예: 자녀" value={emergency.relation} onChange={e=>setEmergency({...emergency,relation:e.target.value})}/></div>
            <div className="field"><label>비상연락처</label><input type="text" value={emergency.phone} onChange={e=>setEmergency({...emergency,phone:e.target.value})}/></div>
          </div>
          <label className="checkline" style={{marginTop:10}}><input type="checkbox" checked={emergency.consent} onChange={e=>setEmergency({...emergency,consent:e.target.checked})}/> 긴급 상황 연락 동의 여부</label>
          {!emergencyOk && <p className="small" style={{marginTop:8, color:'var(--warn)'}}>비상연락망을 '있음'으로 선택한 경우 이름·관계·연락처를 모두 입력해야 등록할 수 있습니다.</p>}
        </>)}
      </div>

      <div className="card" style={{maxWidth:720, marginBottom:16}}>
        <div className="dl" style={{fontWeight:600, marginBottom:10, fontSize:13}}>동의 항목</div>
        <p className="small" style={{marginBottom:10}}>목적별로 동의를 구분하여 저장하며, 연계 시점에 재확인하고 철회일을 관리합니다.</p>
        {CONSENT_ITEMS.map(ci=>(
          <label key={ci.key} className="checkline"><input type="checkbox" checked={consents[ci.key]} onChange={e=>setConsents({...consents,[ci.key]:e.target.checked})}/> {ci.label}</label>
        ))}
        <div className="kv" style={{marginTop:8}}><span className="k">동의 일자</span><span className="mono">{isoDaysAgo(0)}</span></div>
        {!consents.agency && <p className="small" style={{marginTop:6, color:'var(--warn)'}}>기관 연계 동의가 없어도 대상자 등록은 가능하지만, 등록 후 기관 연계 버튼은 비활성화됩니다.</p>}
      </div>

      <div className="card" style={{maxWidth:720}}>
        <div className="dl" style={{fontWeight:600, marginBottom:10, fontSize:13}}>최종 확인</div>
        <div className="kv"><span className="k">사례번호</span><span className="mono">{caseNo}</span></div>
        <div className="kv"><span className="k">이름 · 닉네임</span><span>{form.name || '(미입력)'} · {nicknameFull || '(미입력)'}</span></div>
        <div className="kv"><span className="k">출생연도 · 성별</span><span>{form.birthYear || '(미입력)'}년 · {form.gender}</span></div>
        <div className="kv"><span className="k">전화번호</span><span>{form.phone || '(미입력)'}</span></div>
        <div className="kv"><span className="k">지역 · 담당자</span><span>{form.region} · {(state.caseworkers.find(w=>w.id===form.managerId)||{}).name || '(미배정)'}</span></div>
        <div className="kv"><span className="k">비상연락망</span><span>{hasEmergency==='있음' ? (emergency.name||'(미입력)')+' · '+(emergency.relation||'(미입력)')+' · '+(emergency.phone||'(미입력)') : '없음'}</span></div>
        <div className="kv"><span className="k">동의</span><span>{CONSENT_ITEMS.filter(ci=>consents[ci.key]).length}/{CONSENT_ITEMS.length} 항목 동의</span></div>
        <div style={{marginTop:14, display:'flex', justifyContent:'flex-end'}}>
          <button className="btn btn--primary" disabled={!canSubmit} onClick={finish}>{submitting?'등록 중...':'대상자 등록'}</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   화면 4. 평소상태 등록/수정
   ============================================================ */
function BaselineForm({state, setState, setNav, clientId, isNew, currentCaseworkerId}){
  const client = state.clients.find(c=>c.id===clientId);
  const currentCaseworkerName = (state.caseworkers.find(w=>w.id===currentCaseworkerId)||{}).name || '생활지원사';
  const existing = state.baselines.find(b=>b.clientId===clientId);
  const [domains, setDomains] = useState(existing ? {...existing.domains} : Object.fromEntries(DOMAINS.map(d=>[d.key,'미확인'])));
  const [note, setNote] = useState('');

  if(!client) return <Empty>대상자를 찾을 수 없습니다.</Empty>;
  // 담당 생활지원사(대상자에 배정된 사람)만 평소상태 기준값을 생성·수정할 수 있다.
  const isOwner = client.managerId===currentCaseworkerId;

  function save(){
    if(!isOwner) return;
    const now = new Date().toISOString();
    setState(s=>{
      const others = s.baselines.filter(b=>b.clientId!==clientId);
      const prevVersion = existing ? existing.version+1 : 1;
      return {...s, baselines:[...others, {id:uid('BL'), clientId, version:prevVersion, date:isoDaysAgo(0), approvedBy:currentCaseworkerName, domains, note: note||'평소상태 갱신'}],
        audit:[...s.audit, {id:uid('LOG'), at:now, actor:currentCaseworkerName, action:'평소상태(기준값) 수정',
          detail:client.caseNo+' · v'+prevVersion+' · '+DOMAINS.map(d=>d.label+':'+domains[d.key]).join(', ')}]};
    });
    if(isNew){ setNav({screen:'checkin', params:{clientId}}); }
    else { setNav({screen:'client', params:{id:clientId}}); }
  }

  return (
    <div>
      <div className="section-head"><h2>{client.alias} · 평소상태 {existing?'수정':'초기 등록'}</h2></div>
      <p className="small" style={{marginBottom:14}}>알 수 없는 항목은 정상으로 추정하지 않고 미확인으로 남깁니다. 이후 안부 기록과 비교되는 기준값입니다.</p>
      <div className="domain-grid">
        {DOMAINS.map(d=>(
          <div className="domain-cell" key={d.key}>
            <div className="dl">{d.label}</div>
            <div className="seg">
              {['정상','어려움','미확인'].map(v=>(
                <button key={v} disabled={!isOwner} className={(domains[d.key]===v?'on':'')+(v==='어려움'?' bad':'')+(v==='미확인'?' unk':'')}
                  onClick={()=>isOwner && setDomains({...domains,[d.key]:v})}>{v}</button>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div className="field" style={{marginTop:14, maxWidth:640}}>
        <label>변경 사유 / 메모(선택)</label>
        <textarea disabled={!isOwner} value={note} onChange={e=>setNote(e.target.value)} placeholder="예: 첫 상담 전 담당자 관찰 기반 초기 등록"/>
      </div>
      {!isOwner && <p className="small" style={{marginTop:8, color:'var(--warn)'}}>담당자(나)가 이 대상자의 담당 생활지원사가 아니어서 읽기 전용입니다.</p>}
      <div style={{marginTop:16, display:'flex', gap:8}}>
        <button className="btn" onClick={()=>setNav({screen:'client', params:{id:clientId}})}>취소</button>
        <button className="btn btn--primary" disabled={!isOwner} onClick={save}>{isNew? '저장하고 첫 상담으로' : '평소상태 저장'}</button>
      </div>
    </div>
  );
}

/* ============================================================
   화면 5. 안부 확인 (질문추천 + 전화/방문 기록)
   ============================================================ */
function CheckinForm({state, setState, setNav, clientId, currentCaseworkerId, role}){
  const client = state.clients.find(c=>c.id===clientId);
  const currentCaseworkerName = (state.caseworkers.find(w=>w.id===currentCaseworkerId)||{}).name || '생활지원사';
  const baseline = state.baselines.find(b=>b.clientId===clientId);
  const clientSignals = state.signals.filter(s=>s.clientId===clientId);
  const [method, setMethod] = useState('전화');
  const [statement, setStatement] = useState('');
  const [observation, setObservation] = useState('');
  const [nextDate, setNextDate] = useState(isoDaysFromNow(7));
  const [askedTags, setAskedTags] = useState([]);
  const [situationTag, setSituationTag] = useState(null);

  if(!client) return <Empty>대상자를 찾을 수 없습니다.</Empty>;
  // 담당 생활지원사(대상자에 배정된 사람)만 안부 통화·방문 기록을 작성할 수 있다.
  const isOwner = client.managerId===currentCaseworkerId;

  const unconfirmed = baseline ? DOMAINS.filter(d=>baseline.domains[d.key]==='미확인') : [];
  const openIssues = clientSignals.filter(s=>s.lifecycle!=='종결');
  const recheckDomains = [...new Set(openIssues.map(s=>s.domain))].map(k=>DOMAIN_MAP[k]).filter(Boolean);

  function toggleTag(q){
    setAskedTags(t=> t.includes(q) ? t.filter(x=>x!==q) : [...t, q]);
  }

  function submit(){
    if(!isOwner) return;
    const memoParts = [statement, observation].filter(Boolean).join(' ');
    const rec = {id:uid('REC'), clientId, datetime:new Date().toISOString(), method, statement, observation, memo:memoParts, nextCheckDate:nextDate, createdBy:currentCaseworkerName};
    setState(s=>({...s, records:[...s.records, rec],
      audit:[...s.audit, {id:uid('LOG'), at:new Date().toISOString(), actor:currentCaseworkerName, action:'안부기록 저장', detail:method+' · '+client.caseNo}]}));
    setNav({screen:'analysis', params:{recordId:rec.id}});
  }

  return (
    <div>
      <div className="section-head"><h2>{client.alias} · 안부 확인</h2></div>

      <div className="two-col">
        <div>
          <div className="card" style={{marginBottom:16}}>
            <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>추천 질문</div>
            <div style={{marginBottom:8}} className="small">정기질문</div>
            <div className="tag-row" style={{marginBottom:12}}>
              {QUESTIONS_REGULAR.map(q=>(<span key={q} className={"tag"+(askedTags.includes(q)?'':' off')} onClick={()=>toggleTag(q)}>{q}</span>))}
            </div>
            {unconfirmed.length>0 && <>
              <div style={{marginBottom:8}} className="small">미확인질문 (직전 기록에서 확인되지 않은 영역)</div>
              <div className="tag-row" style={{marginBottom:12}}>
                {unconfirmed.map(d=>(<span key={d.key} className={"tag"+(askedTags.includes(d.hint)?'':' off')} onClick={()=>toggleTag(d.hint)}>{d.label}: {d.hint}</span>))}
              </div>
            </>}
            {recheckDomains.length>0 && <>
              <div style={{marginBottom:8}} className="small">재확인질문 (이전 위험신호 지속 여부)</div>
              <div className="tag-row" style={{marginBottom:12}}>
                {recheckDomains.map(d=>(<span key={d.key} className={"tag"+(askedTags.includes('재확인:'+d.label)?'':' off')} onClick={()=>toggleTag('재확인:'+d.label)}>{d.label} 지속·호전·악화 확인</span>))}
              </div>
            </>}
            <div style={{marginBottom:8}} className="small">상황질문 (선택)</div>
            <div className="tag-row">
              {QUESTIONS_SITUATION.map(s=>(<span key={s.tag} className={"tag"+(situationTag===s.tag?'':' off')} onClick={()=>setSituationTag(situationTag===s.tag?null:s.tag)}>{s.tag}: {s.q}</span>))}
            </div>
          </div>

          <div className="card">
            <div className="field" style={{marginBottom:14}}>
              <label>접촉 방식</label>
              <div className="seg" style={{maxWidth:280}}>
                <button className={method==='전화'?'on':''} onClick={()=>setMethod('전화')}>전화</button>
                <button className={method==='방문'?'on':''} onClick={()=>setMethod('방문')}>방문</button>
              </div>
            </div>
            <div className="field" style={{marginBottom:14}}>
              <label>대상자 진술 <span className="hint">(전화·방문 공통 — 어르신이 실제로 말한 내용)</span></label>
              <textarea value={statement} onChange={e=>setStatement(e.target.value)} placeholder="예: 어제부터 입맛이 없어서 죽만 조금 드셨고, 약은 아침에 깜빡했다고 함."/>
            </div>
            {method==='방문' && (
              <div className="field" style={{marginBottom:14}}>
                <label>담당자 관찰 <span className="hint">(방문 시에만 — 생활지원사가 직접 관찰한 사실)</span></label>
                <textarea value={observation} onChange={e=>setObservation(e.target.value)} placeholder="예: 방 안 정리가 덜 되어 있고 평소보다 말수가 적음."/>
              </div>
            )}
            <div className="field" style={{maxWidth:220}}>
              <label>다음 확인일</label>
              <input type="date" value={nextDate} onChange={e=>setNextDate(e.target.value)}/>
            </div>
            {!isOwner && <p className="small" style={{color:'var(--warn)'}}>담당자(나)가 이 대상자의 담당 생활지원사가 아니어서 안부기록을 작성할 수 없습니다.</p>}
            <div style={{marginTop:16, display:'flex', gap:8}}>
              <button className="btn" onClick={()=>setNav({screen:'client', params:{id:clientId}})}>임시저장</button>
              <button className="btn btn--primary" disabled={!isOwner || (!statement && !observation)} onClick={submit}>기록 저장 · AI 분석 보기</button>
            </div>
          </div>
        </div>

        <div className="card">
          <ClientTimeline state={state} client={client} role={role} title={'이전 이력 · '+client.alias}/>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   화면 6. AI 분석 검토
   ============================================================ */
function AnalysisReview({state, setState, setNav, recordId, currentCaseworkerId}){
  const rec = state.records.find(r=>r.id===recordId);
  const client = rec ? state.clients.find(c=>c.id===rec.clientId) : null;
  const currentCaseworkerName = (state.caseworkers.find(w=>w.id===currentCaseworkerId)||{}).name || '생활지원사';
  const baseline = rec ? state.baselines.find(b=>b.clientId===rec.clientId) : null;
  const priorSignalsForClient = rec ? state.signals.filter(s=>s.clientId===rec.clientId && s.recordId!==rec.id) : [];
  const engineState = useEmbeddingEngineState();

  const [analyzerKey, setAnalyzerKey] = useState('embedding');
  const [rows, setRows] = useState(null); // null = 분석 진행 중
  const [urgency, setUrgency] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [usedFallback, setUsedFallback] = useState(false);
  const [note, setNote] = useState('');
  const wordEmergency = rec ? includesAny(rec.memo||'', EMERGENCY_WORDS) : false;
  const fallEmergency = rec ? detectFallEmergency(rec.memo||'') : false;
  const emergency = wordEmergency || fallEmergency;

  useEffect(()=>{
    if(!rec) return;
    let cancelled = false;
    (async ()=>{
      setAnalyzing(true);
      let result; let fellBack = false;
      const embeddingReady = engineState.status==='ready';
      try{
        if(analyzerKey==='embedding' && embeddingReady){
          result = await embeddingAnalyzer.classify(rec.memo);
        } else {
          result = ruleBasedAnalyzer.classify(rec.memo);
          fellBack = analyzerKey==='embedding' && !embeddingReady;
        }
      }catch(err){
        result = ruleBasedAnalyzer.classify(rec.memo);
        fellBack = true;
      }
      if(cancelled) return;
      const withChange = result.rows.map(r=>({...r, changeType: classifyChange(r.domain, r.status, baseline, priorSignalsForClient)}));
      // aiStatus: AI가 최초로 제안한 값. 담당자가 이후 status를 수정해도 이 값은 바꾸지 않고
      // 그대로 감사 이력·화면에 "AI 최초 제안 → 담당자 수정"으로 남긴다.
      const decided = withChange.map(r=>({...r, aiStatus:r.status, decision: r.status==='이상' ? '승인' : 'skip'}));
      setRows(decided);
      setUsedFallback(fellBack);
      setAnalyzing(false);
    })();
    return ()=>{ cancelled = true; };
  }, [analyzerKey, engineState.status, recordId]);

  // 담당자가 개별 영역 상태를 수정할 때마다(setStatus) rows가 바뀌므로, 우선확인 단계도
  // 항상 "현재 화면에 보이는 최종 상태" 기준으로 다시 계산해 대시보드에 반영될 값과 어긋나지 않게 한다.
  useEffect(()=>{
    if(!rows) return;
    setUrgency(suggestUrgency(rows, emergency));
  }, [rows, emergency]);

  if(!rec) return <Empty>기록을 찾을 수 없습니다.</Empty>;

  const alreadySignaled = state.signals.some(s=>s.recordId===recordId);
  // 담당 생활지원사(대상자에 배정된 사람)만 판정 수정·위험영역 승인/기각·검토 승인을 수행할 수 있다.
  const isOwner = !!(client && client.managerId===currentCaseworkerId);
  const canApprove = isOwner;
  // 첫 통화 여부: 이 클라이언트의 기존 안부기록 중 이 기록이 가장 이른 기록이면 첫 통화로 본다.
  // 첫 통화의 검토 승인값은 신규대상자 첫통화 기준값 오류수정 요청(수정 2)에 따라 평소상태(v1)에 그대로 반영한다.
  const clientRecordsSorted = state.records.filter(r=>r.clientId===rec.clientId).slice().sort((a,b)=>a.datetime.localeCompare(b.datetime));
  const isFirstCall = clientRecordsSorted.length>0 && clientRecordsSorted[0].id===rec.id;
  // 평소상태(v1) 기준값은 인지·의사소통을 제외한 5개 핵심 영역만 이 자동 생성 로직으로 채운다 —
  // 인지·의사소통은 별도 정책(명시적 근거가 없으면 미확인 유지)을 그대로 따른다.
  const BASELINE_CORE_DOMAINS = DOMAINS.filter(d=>d.key!=='cognition').map(d=>d.key);
  const STATUS_TO_BASELINE = {'정상':'정상','이상':'어려움','미확인':'미확인'};

  function setDecision(domain, decision){
    setRows(rs=>rs.map(r=>r.domain===domain?{...r,decision}:r));
  }
  function setStatus(domain, status){
    setRows(rs=>rs.map(r=>{
      if(r.domain!==domain) return r;
      const changeType = classifyChange(r.domain, status, baseline, priorSignalsForClient);
      // 상태를 바꾸면 승인 여부도 그 상태에 맞게 다시 정한다: '이상'이면 기본 승인 대상,
      // 그 외(정상·미확인)는 위험신호를 만들 대상이 아니므로 skip.
      const decision = status==='이상' ? '승인' : 'skip';
      const nextQuestion = status==='미확인' ? (r.nextQuestion || DOMAIN_NEXT_QUESTION[r.domain] || null) : null;
      return {...r, status, changeType, decision, nextQuestion};
    }));
  }

  function approve(){
    if(!canApprove) return;
    const now = new Date().toISOString();
    let signals = state.signals;
    const changeLog = [];

    rows.forEach(r=>{
      // 이번 통화에서 언급조차 안 된 영역(미확인, AI 제안에서 손대지 않음)은 완전히 건드리지 않는다.
      // 그런 영역까지 매번 훑으면 이번 통화와 무관한 다른 영역의 진행 중인 사건을 잘못 종결시키게 된다.
      // (단, 이번 통화에서 언급되어 '정상'으로 호전 확인된 영역은 미확인이 아니므로 반드시 건드려서
      // 기존에 열려 있던 사건을 종결시켜야 한다 — 그렇지 않으면 이미 해소된 신호가 계속 미처리로 남는다.)
      const touched = r.status!=='미확인' || r.aiStatus!==r.status;
      if(!touched) return;
      const isAnomaly = r.status==='이상' && r.decision==='승인';
      // 대상자·위험영역 기준으로 진행 중인 사건이 있으면(같은 기록 재검토 포함) 새 카드 대신 누적한다.
      const result = upsertDomainSignal(signals, {
        clientId:rec.clientId, recordId:rec.id, domain:r.domain, label:r.label, isAnomaly, status:r.status, decision:r.decision,
        excerpt:r.excerpt, time:r.time, changeType:r.changeType, urgency,
        analyzerMethod: r.method || 'rule', similarity: r.similarity!=null ? r.similarity : null, aiSuggestedStatus: r.aiStatus,
        reviewedBy:currentCaseworkerName, reviewNote: note || 'AI 제안 확인 후 승인',
        at:now, fallbackDeadline: rec.nextCheckDate,
      });
      signals = result.signals;
      if(result.note){
        changeLog.push(result.note
          +(r.aiStatus!==r.status ? ' (AI 제안 '+r.aiStatus+' → 담당자 수정 '+r.status+')' : '')
          +(!isAnomaly && r.status==='미확인' && r.nextQuestion ? ' · 다음 통화 질문: '+r.nextQuestion : ''));
      }
    });

    // 신규대상자 첫통화 기준값 오류수정 요청(수정 2): 첫 통화 승인 시 AI 최초 제안이 아니라
    // 담당자가 화면에서 마지막으로 확정한 검토값(rows의 현재 status)을 평소상태 기준값(v1)에 저장한다.
    // 위험신호 생성(위 upsertDomainSignal)과는 별개 저장이며, 이상으로 승인되지 않은 영역(정상·미확인)도
    // 포함해 5개 핵심 영역 전체를 채운다 — 그래야 "전 영역 미확인 초기화" 버그가 재발하지 않는다.
    let baselines = state.baselines;
    let baselineNote = null;
    if(isFirstCall){
      const existingBaseline = state.baselines.find(b=>b.clientId===rec.clientId);
      const domains = existingBaseline ? {...existingBaseline.domains} : Object.fromEntries(DOMAINS.map(d=>[d.key,'미확인']));
      rows.forEach(r=>{
        if(!BASELINE_CORE_DOMAINS.includes(r.domain)) return;
        domains[r.domain] = STATUS_TO_BASELINE[r.status] || '미확인';
      });
      const updatedBaseline = {
        id: existingBaseline ? existingBaseline.id : uid('BL'),
        clientId: rec.clientId, version: 1, date: now.slice(0,10),
        approvedBy: currentCaseworkerName, domains,
        note: '첫 통화 승인값으로 평소상태(v1) 자동 생성',
      };
      baselines = [...state.baselines.filter(b=>b.clientId!==rec.clientId), updatedBaseline];
      baselineNote = '평소상태(v1) 자동 생성';
    }

    setState(s=>({...s, signals, baselines,
      audit:[...s.audit, {id:uid('LOG'), at:now, actor:currentCaseworkerName, action:'AI 분석 검토·승인',
        detail:client.caseNo+(changeLog.length?' · '+changeLog.join(' / '):' · 변경 없음')+(baselineNote?' · '+baselineNote:'')}]}));
    setNav({screen:'client', params:{id:rec.clientId}});
  }

  function methodLabel(r){
    if(r.method==='embedding') return '임베딩 분석 · 유사도 '+(r.similarity!=null ? r.similarity.toFixed(2) : '-');
    if(r.method==='rule-fallback') return '규칙 기반 폴백 (임베딩 호출 실패)';
    if(r.method==='rule' && r.domain==='emergency') return '규칙 기반 (긴급 표현은 항상 키워드로 판정)';
    return null;
  }

  return (
    <div>
      <div className="section-head"><h2>{client ? client.alias : ''} · AI 분석 검토</h2></div>
      {wordEmergency && <div className="disclaimer" style={{background:'var(--danger-soft)', borderColor:'var(--danger)'}}>
        ⚠ 긴급 표현이 감지되었습니다. 자살·자해·화재·학대 의심 등 표현은 규칙 기반으로 즉시 상향 알림됩니다. 담당자가 즉시 원문을 확인하세요.
      </div>}
      {fallEmergency && <div className="disclaimer" style={{background:'var(--danger-soft)', borderColor:'var(--danger)'}}>
        ⚠ 낙상 후 심각 징후(일어나지 못함·머리 충격·출혈·의식 변화·심한 통증 중 하나 이상)가 함께 감지되었습니다.
        이 상황은 일반 기관 연계 절차와 별도로, 기관의 위기대응 지침에 따라 담당자가 즉시 대응하세요. 필요 시 119(소방·구급) 또는 112(경찰)에 즉시 연락하세요.
      </div>}
      <div className="two-col">
        <div className="card">
          <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>원문 기록 <span className="small">({rec.method} · {fmtDateTime(rec.datetime)})</span></div>
          {rec.statement && <div style={{marginBottom:10}}><div className="small" style={{marginBottom:4}}>대상자 진술</div><div className="pc-excerpt">{rec.statement}</div></div>}
          {rec.observation && <div><div className="small" style={{marginBottom:4}}>담당자 관찰</div><div className="pc-excerpt">{rec.observation}</div></div>}
          <hr className="rule"/>
          <div className="field">
            <label>분석 방식</label>
            <div className="seg" style={{maxWidth:280}}>
              <button className={analyzerKey==='embedding'?'on':''} onClick={()=>setAnalyzerKey('embedding')}>임베딩 분석(AI)</button>
              <button className={analyzerKey==='rule'?'on':''} onClick={()=>setAnalyzerKey('rule')}>규칙 기반</button>
            </div>
            {analyzerKey==='embedding' && !['ready','error','timeout'].includes(engineState.status) && (
              <p className="small" style={{marginTop:4}}>{engineState.message||'모델 준비 중'} — 준비될 때까지는 규칙 기반 결과를 임시로 보여줍니다.</p>
            )}
            {analyzerKey==='embedding' && (engineState.status==='error' || engineState.status==='timeout') && (
              <p className="small" style={{marginTop:4, color:'var(--warn)'}}>{engineState.message || 'AI 모델을 불러오지 못해 기본 규칙으로 분석했습니다.'}</p>
            )}
            {usedFallback && engineState.status==='ready' && (
              <p className="small" style={{marginTop:4, color:'var(--warn)'}}>이번 분석은 임베딩 호출 오류로 규칙 기반 결과입니다.</p>
            )}
          </div>
          <div className="field" style={{marginTop:14}}>
            <label>제안 우선확인 단계</label>
            <select value={urgency||''} onChange={e=>setUrgency(e.target.value)} disabled={!canApprove || !rows}>
              {Object.keys(URGENCY).map(u=>(<option key={u} value={u}>{u}</option>))}
            </select>
          </div>
          <div className="field" style={{marginTop:10}}>
            <label>검토 사유 / 수정 메모</label>
            <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="AI 제안에 대한 승인·수정·기각 사유를 남겨주세요."/>
          </div>
          {alreadySignaled && <p className="small" style={{marginTop:8, color:'var(--warn)'}}>이 기록은 이미 검토·승인되었습니다. 다시 승인하면 지금 화면의 최종 상태로 위험신호가 갱신됩니다.</p>}
          {!isOwner && <p className="small" style={{marginTop:8, color:'var(--warn)'}}>담당자(나)가 이 대상자의 담당 생활지원사가 아니어서 읽기 전용입니다. 판정 수정·검토 승인은 담당 생활지원사만 할 수 있습니다.</p>}
          <div style={{marginTop:14}}>
            <button className="btn btn--primary" disabled={!canApprove || !rows} onClick={approve}>{alreadySignaled ? '검토 결과 재승인 · 신호 갱신' : '검토 결과 승인 · 신호 생성'}</button>
          </div>
        </div>

        <div className="card">
          <div className="dl" style={{fontWeight:600, marginBottom:10, fontSize:13}}>영역별 구조화 결과</div>
          {!rows ? (
            <p className="small">{analyzing ? '분석 중...' : '분석 대기 중'}</p>
          ) : rows.map(r=>(
            <div key={r.domain} style={{padding:'10px 0', borderBottom:'1px solid var(--line)'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:8}}>
                <strong style={{fontSize:12.5}}>{r.label}</strong>
                <div className="seg" style={{maxWidth:220}}>
                  {['정상','이상','미확인'].map(v=>(
                    <button key={v} disabled={!canApprove} className={(r.status===v?'on':'')+(v==='이상'?' bad':'')+(v==='미확인'?' unk':'')} onClick={()=>canApprove && setStatus(r.domain,v)}>{v}</button>
                  ))}
                </div>
              </div>
              <div className="small" style={{marginTop:4}}>{r.content} · 시점 {r.time} · 변화 {r.changeType && r.changeType!=='-' ? r.changeType : '해당없음'}</div>
              {r.aiStatus && r.aiStatus!==r.status && (
                <div className="small" style={{marginTop:2, color:'var(--warn)'}}>AI 최초 제안: {r.aiStatus} → 담당자 수정: {r.status}</div>
              )}
              {methodLabel(r) && <div className="small" style={{marginTop:2, color:'var(--info)'}}>{methodLabel(r)}</div>}
              <div className="pc-excerpt" style={{marginTop:6}}>{r.excerpt}</div>
              {r.status==='미확인' && r.nextQuestion && (
                <div className="small" style={{marginTop:4, color:'var(--info)'}}>다음 통화 확인 질문: {r.nextQuestion}</div>
              )}
              {r.status==='이상' && (
                <div className="seg" style={{marginTop:6, maxWidth:220}}>
                  <button disabled={!canApprove} className={r.decision==='승인'?'on':''} onClick={()=>canApprove && setDecision(r.domain,'승인')}>승인</button>
                  <button disabled={!canApprove} className={r.decision==='기각'?'on bad':''} onClick={()=>canApprove && setDecision(r.domain,'기각')}>기각</button>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   화면 7. 우선확인 대시보드
   ============================================================ */
function PriorityDashboard({state, setNav}){
  const [filter, setFilter] = useState('전체');
  const open = state.signals.filter(s=>s.lifecycle!=='종결');
  const levels = ['전체', ...Object.keys(URGENCY)];
  const shown = filter==='전체' ? open : open.filter(s=>s.urgency===filter);
  const sorted = shown.slice().sort((a,b)=>URGENCY[a.urgency].order-URGENCY[b.urgency].order);

  return (
    <div>
      <div className="section-head">
        <h2>우선확인 대시보드</h2>
        <span className="count">{sorted.length}건</span>
      </div>
      <div className="tag-row" style={{marginBottom:16}}>
        {levels.map(l=>(<span key={l} className={"tag"+(filter===l?'':' off')} onClick={()=>setFilter(l)}>{l}</span>))}
      </div>
      {sorted.length===0 ? <Empty>해당 단계의 신호가 없습니다.</Empty> : (
        <div className="card-grid">
          {sorted.map(s=>{
            const c = state.clients.find(cl=>cl.id===s.clientId);
            const tone = URGENCY[s.urgency].chip;
            return (
              <div className="priority-card" key={s.id} onClick={()=>setNav({screen:'signal', params:{id:s.id}})}>
                <div className={"stripe stripe--"+tone}></div>
                <div className="pc-body">
                  <div className="pc-top">
                    <div><div className="pc-name">{c?c.alias:'-'}</div><div className="pc-meta">{c?c.caseNo:''} · {s.label}</div></div>
                    <UrgencyBadge level={s.urgency}/>
                  </div>
                  <div className="pc-excerpt">{s.excerpt}</div>
                  <div className="pc-foot">
                    <span>변화: {s.changeType && s.changeType!=='-' ? s.changeType : '-'}</span>
                    <LifecycleBadge state={s.lifecycle}/>
                  </div>
                  <div className="pc-foot"><span>처리기한</span><span className="mono">{s.deadline==='즉시'?'즉시':fmtDate(s.deadline)}</span></div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   화면 8/9. 신호 상세 + 연계 후보 검토/진행
   ============================================================ */
function SignalDetail({state, setState, setNav, id, currentCaseworkerId}){
  const s = state.signals.find(x=>x.id===id);
  if(!s) return <Empty>신호를 찾을 수 없습니다.</Empty>;
  const client = state.clients.find(c=>c.id===s.clientId);
  // 담당 생활지원사(대상자에 배정된 사람)만 신호 진행상태·연계 후보를 수정할 수 있다.
  const canAct = !!(client && client.managerId===currentCaseworkerId);
  const clientGu = regionToGu(client && client.region);
  // 구별 기관(보건소·치매안심센터·정신건강복지센터 등)은 대상자 주소의 관할 구와 일치할 때만 보여준다.
  const matches = POLICY_SEED.filter(p=>p.domains.includes(s.domain) && (!p.gu || p.gu===clientGu));
  const clientReferrals = state.referrals.filter(r=>r.signalId===s.id);
  const [reasonDraft, setReasonDraft] = useState('');
  // 기관 연계(정책·서비스 의뢰) 동의가 없으면 연계 후보 생성·개인정보 포함 연계정보 전송을 막는다.
  const agencyConsentOk = !!(client && client.consents && client.consents.agency);
  const isEmergency = s.urgency==='긴급확인';

  function setLifecycle(v){
    if(!canAct) return;
    setState(st=>({...st, signals: st.signals.map(x=>x.id===id?{...x, lifecycle:v, history:[...x.history,{at:new Date().toISOString(), note:'상태 변경 → '+v}]}:x)}));
  }
  function closeSignal(reason){
    if(!canAct) return;
    setState(st=>({...st, signals: st.signals.map(x=>x.id===id?{...x, lifecycle:'종결', reviewNote:reason, history:[...x.history,{at:new Date().toISOString(), note:'종결: '+reason}]}:x)}));
  }
  function createReferral(policy){
    if(!canAct) return;
    if(!agencyConsentOk) return; // 방어: 버튼 비활성화와 무관하게 동의 없이는 연계정보를 생성하지 않는다
    const ref = {id:uid('REF'), clientId:s.clientId, signalId:s.id, policyId:policy.id, reason:reasonDraft || (policy.name+' 적합 영역: '+s.label),
      status:'검토후보', consentDate:'', nextReviewDate:isoDaysFromNow(7), outcome:'', history:[{at:new Date().toISOString(), note:'연계 검토 후보 생성'}]};
    setState(st=>({...st, referrals:[...st.referrals, ref]}));
  }
  function updateReferralStatus(refId, status){
    if(!canAct) return;
    setState(st=>({...st, referrals: st.referrals.map(r=>r.id===refId?{...r, status, history:[...r.history,{at:new Date().toISOString(), note:'상태 변경 → '+status}]}:r)}));
  }

  return (
    <div>
      <div className="section-head"><h2>{client?client.alias:''} · {s.label} 신호 상세</h2></div>
      {isEmergency && <div className="disclaimer" style={{background:'var(--danger-soft)', borderColor:'var(--danger)'}}>
        ⚠ 긴급확인 신호입니다. 아래 일반 기관 연계 절차와 별도로, 기관의 위기대응 지침에 따라 담당자가 즉시 대응하세요.
        필요 시 119(소방·구급) 또는 112(경찰)에 즉시 연락하세요.
      </div>}
      <div className="two-col">
        <div className="card">
          <div style={{display:'flex', gap:8, marginBottom:10}}>
            <UrgencyBadge level={s.urgency}/><LifecycleBadge state={s.lifecycle}/>
            {s.changeType && s.changeType!=='-' && <Badge tone="amber">변화: {s.changeType}</Badge>}
          </div>
          <div className="pc-excerpt" style={{marginBottom:10}}>{s.excerpt}</div>
          <div className="kv"><span className="k">시점</span><span>{s.time}</span></div>
          {s.repeatCount>1 && <div className="kv"><span className="k">반복 횟수</span><span>{s.repeatCount}회 (같은 위험영역 진행 중 사건에 누적, 최근 발견일 {fmtDateTime(s.lastSeenAt||s.createdAt)})</span></div>}
          {s.analyzerMethod && <div className="kv"><span className="k">분석 방식</span><span>{
            s.analyzerMethod==='embedding' ? '임베딩 분석(AI) · 유사도 '+(s.similarity!=null?s.similarity.toFixed(2):'-')
            : s.analyzerMethod==='rule-fallback' ? '규칙 기반 폴백'
            : '규칙 기반'
          }</span></div>}
          <div className="kv"><span className="k">처리기한</span><span>{s.deadline==='즉시'?'즉시':fmtDate(s.deadline)}</span></div>
          <div className="kv"><span className="k">검토자</span><span>{s.reviewedBy}</span></div>
          <div className="kv"><span className="k">검토 사유</span><span>{s.reviewNote}</span></div>

          <hr className="rule"/>
          <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>진행 상태</div>
          <div className="tag-row" style={{marginBottom:10}}>
            {['확인대기','검토완료','조치중','연계중','추적중'].map(v=>(
              <span key={v} className={"tag"+(s.lifecycle===v?'':' off')} onClick={()=>canAct && setLifecycle(v)}>{v}</span>
            ))}
          </div>
          {canAct && s.lifecycle!=='종결' && (
            <div style={{display:'flex', gap:8}}>
              <button className="btn btn--sm" onClick={()=>closeSignal('호전 확인')}>호전으로 종결</button>
              <button className="btn btn--sm" onClick={()=>closeSignal('서비스 연결 완료')}>서비스 연결 완료로 종결</button>
              <button className="btn btn--sm" onClick={()=>closeSignal('오탐·정상 일정')}>오탐으로 종결</button>
            </div>
          )}
          {!canAct && <p className="small">담당자(나)가 이 대상자의 담당 생활지원사가 아니어서 상태를 변경할 수 없습니다.</p>}

          <hr className="rule"/>
          <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>이력</div>
          <div className="timeline">
            {s.history.map((h,i)=>(
              <div className="tl-item" key={i}><div className="tl-dot"></div><div className="tl-when">{fmtDateTime(h.at)}</div><div className="tl-body">{h.note}</div></div>
            ))}
          </div>
        </div>

        <div className="card">
          <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>정책·기관 연계 후보</div>
          <p className="small" style={{marginBottom:10}}>'신청 가능'이 아닌 '연계 검토 후보'로 표시합니다. 지역 가용성은 별도 확인이 필요합니다.</p>
          {!agencyConsentOk && (
            <div className="disclaimer" style={{marginBottom:10}}>
              기관 연계 동의가 확인되지 않아 연계를 진행할 수 없습니다.
              <div style={{marginTop:8, display:'flex', gap:8}}>
                <button className="btn btn--sm" onClick={()=>setNav({screen:'client', params:{id:s.clientId}})}>동의 확인</button>
                <button className="btn btn--sm" disabled={!canAct} onClick={()=>setNav({screen:'client', params:{id:s.clientId}})}>동의 정보 수정</button>
              </div>
            </div>
          )}
          {matches.map(p=>(
            <div key={p.id} style={{padding:'10px 0', borderBottom:'1px solid var(--line)'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8}}>
                <div><strong style={{fontSize:12.5}}>{p.name}</strong><div className="small">{p.serviceType} · 담당 지역 {p.region}</div></div>
                <button className="btn btn--sm" disabled={!canAct || !agencyConsentOk} onClick={()=>createReferral(p)}>연계 후보로 추가</button>
              </div>
              {p.recommendText && <div className="small" style={{marginTop:4, color:'var(--info)'}}>추천 이유: {p.recommendText}</div>}
              <div className="small" style={{marginTop:2}}>대상조건: {p.cond}</div>
              <div className="small" style={{marginTop:2}}>
                전화번호: {p.contact || '확인 필요(담당기관 문의)'}
                {p.url ? <> · <a href={p.url} target="_blank" rel="noreferrer" className="btn btn--sm" style={{marginLeft:4, display:'inline-block'}}>공식 홈페이지</a></> : <span> · 공식 홈페이지: 확인 필요</span>}
              </div>
              <div className="small" style={{marginTop:2}}>정보 확인일 {fmtDate(p.checkedDate)} · 지역 가용 여부: {p.regionAvailable ? '가능' : '확인 필요'}</div>
              <div className="small" style={{marginTop:2, color:'var(--warn)'}}>신청 가능 여부는 담당기관 확인 필요</div>
            </div>
          ))}
          {matches.length===0 && <p className="small">매칭되는 정책이 없습니다.</p>}

          <hr className="rule"/>
          <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>연계 진행 현황</div>
          {clientReferrals.length===0 ? <p className="small">아직 생성된 연계가 없습니다.</p> : clientReferrals.map(r=>{
            const p = POLICY_SEED.find(x=>x.id===r.policyId);
            return (
              <div key={r.id} style={{padding:'10px 0', borderBottom:'1px solid var(--line)'}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                  <strong style={{fontSize:12.5}}>{p?p.name:r.policyId}</strong><ReferralBadge state={r.status}/>
                </div>
                <div className="small" style={{margin:'4px 0'}}>{r.reason}</div>
                <div className="tag-row">
                  {['검토후보','동의','문의','접수','대기','거절','자격미충족','완료'].map(v=>(
                    <span key={v} className={"tag"+(r.status===v?'':' off')} onClick={()=>canAct && updateReferralStatus(r.id, v)}>{v}</span>
                  ))}
                </div>
                <div className="small" style={{marginTop:4}}>다음 재평가: {fmtDate(r.nextReviewDate)}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   화면 10. 대상자 프로필(타임라인)
   ============================================================ */
function ClientProfile({state, setState, setNav, id, role, currentCaseworkerId}){
  const client = state.clients.find(c=>c.id===id);
  if(!client) return <Empty>대상자를 찾을 수 없습니다.</Empty>;
  const baseline = state.baselines.find(b=>b.clientId===id);
  const currentCaseworkerName = (state.caseworkers.find(w=>w.id===currentCaseworkerId)||{}).name || '생활지원사';
  // 담당 생활지원사(대상자에 배정된 사람)만 동의·비상연락망 정보를 수정할 수 있다.
  // 다른 생활지원사에게 배정된 대상자는 조회만 가능하고 수정은 막는다(신규대상자 첫통화 기준값
  // 오류수정 요청 [수정 3] 권한 안전장치).
  const isOwner = client.managerId===currentCaseworkerId;
  const consentLabel = {privacy:'개인정보 수집·이용', ai:'AI분석', agency:'기관연계', emergency:'비상상황연락'};
  const [emergencyDraft, setEmergencyDraft] = useState(null); // null = 편집 중 아님

  function toggleConsent(key){
    if(!isOwner) return;
    const before = !!client.consents[key];
    setState(st=>({...st, clients: st.clients.map(c=>c.id===id?{...c, consents:{...c.consents, [key]:!before, date:isoDaysAgo(0)}}:c),
      audit:[...st.audit, {id:uid('LOG'), at:new Date().toISOString(), actor:currentCaseworkerName, action:'동의 정보 수정',
        detail:client.caseNo+' · '+(consentLabel[key]||key)+' 동의: '+(before?'동의':'미동의')+' → '+(!before?'동의':'미동의')}]}));
  }

  function startEmergencyEdit(){
    if(!isOwner) return;
    const e = client.emergency || {has:'없음'};
    setEmergencyDraft({has:e.has||'없음', name:e.name||'', relation:e.relation||'', phone:e.phone||'', consent:!!e.consent});
  }
  function saveEmergencyEdit(){
    if(!isOwner || !emergencyDraft) return;
    const before = client.emergency || {has:'없음'};
    const next = emergencyDraft.has==='있음'
      ? {has:'있음', name:emergencyDraft.name, relation:emergencyDraft.relation, phone:emergencyDraft.phone, consent:emergencyDraft.consent}
      : {has:'없음'};
    const beforeLabel = before.has==='있음' ? before.name+'·'+before.relation+'·'+before.phone : '없음';
    const afterLabel = next.has==='있음' ? next.name+'·'+next.relation+'·'+next.phone : '없음';
    setState(st=>({...st, clients: st.clients.map(c=>c.id===id?{...c, emergency:next}:c),
      audit:[...st.audit, {id:uid('LOG'), at:new Date().toISOString(), actor:currentCaseworkerName, action:'비상연락망 정보 수정',
        detail:client.caseNo+' · '+beforeLabel+' → '+afterLabel}]}));
    setEmergencyDraft(null);
  }

  return (
    <div>
      <div className="section-head">
        <h2>{client.alias}</h2>
        <div style={{display:'flex', gap:8}}>
          <button className="btn btn--sm" disabled={!isOwner} onClick={()=>setNav({screen:'baseline', params:{clientId:id}})}>평소상태 수정</button>
          <button className="btn btn--primary btn--sm" disabled={!isOwner} onClick={()=>setNav({screen:'checkin', params:{clientId:id}})}>안부확인 시작</button>
        </div>
      </div>
      {!isOwner && <div className="disclaimer">담당자(나)가 이 대상자의 담당 생활지원사가 아니어서 읽기 전용으로 조회 중입니다. 정보 수정은 담당 생활지원사만 할 수 있습니다.</div>}

      <div className="two-col">
        <div>
          <div className="card" style={{marginBottom:16}}>
            <div className="kv"><span className="k">사례번호</span><span className="mono">{client.caseNo}</span></div>
            <div className="kv"><span className="k">이름</span><span>{client.name || '-'}</span></div>
            <div className="kv"><span className="k">출생연도 · 성별</span><span>{client.birthYear}년 · {client.gender}</span></div>
            <div className="kv"><span className="k">전화번호</span><span className="mono">{client.phone || '-'}</span></div>
            <div className="kv"><span className="k">지역</span><span>{client.region}</span></div>
            <div className="kv"><span className="k">담당자</span><span>{(state.caseworkers.find(w=>w.id===client.managerId)||{}).name || '미배정'}</span></div>
          </div>

          <div className="card" style={{marginBottom:16}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline'}}>
              <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>비상연락망</div>
              {isOwner && !emergencyDraft && <button className="btn btn--sm" onClick={startEmergencyEdit}>수정</button>}
            </div>
            {!emergencyDraft ? (
              <div className="kv"><span className="k">등록 내용</span><span>{client.emergency && client.emergency.has==='있음' ? client.emergency.name+' · '+client.emergency.relation+' · '+client.emergency.phone+(client.emergency.consent?' · 연락동의':' · 연락동의 없음') : '없음'}</span></div>
            ) : (
              <div>
                <div className="field" style={{maxWidth:220, marginBottom:10}}>
                  <label>비상연락망 여부</label>
                  <select value={emergencyDraft.has} onChange={e=>setEmergencyDraft({...emergencyDraft, has:e.target.value})}><option>없음</option><option>있음</option></select>
                </div>
                {emergencyDraft.has==='있음' && (<>
                  <div className="form-grid">
                    <div className="field"><label>비상연락 대상자 이름</label><input type="text" value={emergencyDraft.name} onChange={e=>setEmergencyDraft({...emergencyDraft,name:e.target.value})}/></div>
                    <div className="field"><label>관계</label><input type="text" value={emergencyDraft.relation} onChange={e=>setEmergencyDraft({...emergencyDraft,relation:e.target.value})}/></div>
                    <div className="field"><label>비상연락처</label><input type="text" value={emergencyDraft.phone} onChange={e=>setEmergencyDraft({...emergencyDraft,phone:e.target.value})}/></div>
                  </div>
                  <label className="checkline" style={{marginTop:10}}><input type="checkbox" checked={emergencyDraft.consent} onChange={e=>setEmergencyDraft({...emergencyDraft,consent:e.target.checked})}/> 긴급 상황 연락 동의 여부</label>
                </>)}
                <div style={{marginTop:10, display:'flex', gap:8}}>
                  <button className="btn" onClick={()=>setEmergencyDraft(null)}>취소</button>
                  <button className="btn btn--primary" onClick={saveEmergencyEdit}>저장</button>
                </div>
              </div>
            )}
          </div>

          <div className="card" style={{marginBottom:16}}>
            <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>동의 확인·수정</div>
            <label className="checkline"><input type="checkbox" checked={!!client.consents.privacy} disabled={!isOwner} onChange={()=>toggleConsent('privacy')}/> 개인정보 수집·이용 동의</label>
            <label className="checkline"><input type="checkbox" checked={!!client.consents.ai} disabled={!isOwner} onChange={()=>toggleConsent('ai')}/> AI 분석 활용 동의</label>
            <label className="checkline"><input type="checkbox" checked={!!client.consents.agency} disabled={!isOwner} onChange={()=>toggleConsent('agency')}/> 기관 연계 동의</label>
            <label className="checkline"><input type="checkbox" checked={!!client.consents.emergency} disabled={!isOwner} onChange={()=>toggleConsent('emergency')}/> 비상 상황 연락 동의</label>
            <div className="kv" style={{marginTop:6}}><span className="k">동의 일자</span><span className="mono">{client.consents.date || '-'}</span></div>
            {!client.consents.agency && <p className="small" style={{marginTop:6, color:'var(--warn)'}}>기관 연계 동의가 없어 이 대상자는 연계 후보 생성·연계정보 전송이 제한됩니다.</p>}
            {!isOwner && <p className="small" style={{marginTop:6}}>담당자(나)가 이 대상자의 담당 생활지원사가 아니어서 동의 정보를 수정할 수 없습니다.</p>}
          </div>

          {baseline && (
            <div className="card">
              <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>평소상태 (기준값 v{baseline.version})</div>
              {DOMAINS.map(d=>(
                <div className="kv" key={d.key}><span className="k">{d.label}</span><BaselineBadge v={baseline.domains[d.key]}/></div>
              ))}
            </div>
          )}
        </div>

        <div>
          <ClientTimeline state={state} client={client} role={role}/>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   화면 11. 정책·기관 DB
   ============================================================ */
function PolicyDB({state}){
  const [guFilter, setGuFilter] = useState('전체');
  const guOptions = ['전체', ...GU_LIST.map(g=>g.label), '전남 광주 전역', '전국'];
  const filtered = POLICY_SEED.filter(p=>{
    if(guFilter==='전체') return true;
    if(guFilter==='전남 광주 전역') return !p.gu && p.region==='전남 광주 전역';
    if(guFilter==='전국') return !p.gu && p.region==='전국';
    const g = GU_LIST.find(x=>x.label===guFilter);
    return g && p.gu===g.key;
  });

  const byRegion = {};
  POLICY_SEED.forEach(p=>{ byRegion[p.region]=(byRegion[p.region]||0)+1; });
  const noUrl = POLICY_SEED.filter(p=>!p.url);

  return (
    <div>
      <div className="section-head"><h2>정책·기관 DB</h2><span className="count">{POLICY_SEED.length}건</span></div>

      <div className="card" style={{marginBottom:16}}>
        <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>등록 현황 요약</div>
        <div className="kv"><span className="k">등록된 전체 기관 수</span><span className="mono">{POLICY_SEED.length}건</span></div>
        <div className="kv"><span className="k">지역별 기관 수</span><span>{Object.entries(byRegion).map(([r,n])=>r+' '+n+'건').join(' · ')}</span></div>
        <div className="kv"><span className="k">홈페이지 링크 없는 기관</span><span className="mono">{noUrl.length}건</span></div>
        {noUrl.length>0 && (
          <p className="small" style={{marginTop:6, color:'var(--warn)'}}>
            {noUrl.map(p=>p.name).join(', ')} — 공식 홈페이지·실제 연락처는 임의로 만들지 않고 비워두었습니다. 확인되는 대로 채워 넣어야 합니다.
          </p>
        )}
      </div>

      <div className="field" style={{marginBottom:12, maxWidth:280}}>
        <label>담당 지역 필터</label>
        <select value={guFilter} onChange={e=>setGuFilter(e.target.value)}>
          {guOptions.map(o=>(<option key={o} value={o}>{o}</option>))}
        </select>
      </div>

      <div className="table-wrap">
        <table>
          <thead><tr><th>기관·정책 공식명</th><th>서비스 구분</th><th>연결 위험영역</th><th>담당 지역</th><th>대상조건</th><th>신청방법</th><th>연락처</th><th>공식 홈페이지</th><th>정보 확인일 · 만료일</th><th>지역 가용</th></tr></thead>
          <tbody>
            {filtered.map(p=>(
              <tr key={p.id}>
                <td>{p.name}<div className="small">{p.org}</div></td>
                <td>{p.serviceType}</td>
                <td>{p.domains.map(k=>DOMAIN_MAP[k]?.label).filter(Boolean).join(', ')}</td>
                <td>{p.region}</td>
                <td>{p.cond}</td>
                <td>{p.apply}</td>
                <td>{p.contact || '확인 필요'}</td>
                <td>{p.url ? <a href={p.url} target="_blank" rel="noreferrer">바로가기</a> : '확인 필요'}</td>
                <td className="small mono">{fmtDate(p.checkedDate)} ~ {fmtDate(p.expireDate)}</td>
                <td>{p.regionAvailable ? '가능' : '확인 필요'}</td>
              </tr>
            ))}
            {filtered.length===0 && <tr><td colSpan="10"><Empty>해당 지역에 등록된 기관이 없습니다.</Empty></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================
   화면 12. 관리자 통계
   ============================================================ */
function EmbeddingAccuracyPanel(){
  const engineState = useEmbeddingEngineState();
  const [running, setRunning] = useState(false);
  const [results, setResults] = useState(null);

  async function run(){
    setRunning(true);
    const res = await runEmbeddingAccuracyTest(); // 결과는 함수 내부에서 콘솔에도 출력됨
    setResults(res);
    setRunning(false);
  }

  const passCount = results ? results.filter(r=>r.pass).length : 0;
  const pct = results ? Math.round(passCount/results.length*100) : null;
  const case31 = results ? results.find(r=>r.id===31) : null;

  return (
    <div className="card" style={{marginBottom:24}}>
      <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>임베딩 분석기 정확도 검증</div>
      <p className="small" style={{marginBottom:10}}>사전 정의된 31개 예시 문장(1~30은 참고 예시 자체, 31은 절 경계 오탐 검증용 복합 문장)으로 embeddingAnalyzer의 판정 정확도를 확인합니다. 결과는 브라우저 콘솔에도 출력됩니다.</p>
      <button className="btn btn--primary btn--sm" disabled={running || engineState.status!=='ready'} onClick={run}>
        {running ? '검증 실행 중...' : '정확도 검증 실행'}
      </button>
      {engineState.status!=='ready' && (
        <p className="small" style={{marginTop:8, color:'var(--warn)'}}>AI 분석 모델이 준비되어야 실행할 수 있습니다 (현재: {engineState.message || engineState.status}).</p>
      )}
      {results && (
        <div style={{marginTop:14}}>
          <div style={{display:'flex', gap:14, alignItems:'baseline', marginBottom:10, flexWrap:'wrap'}}>
            <div className="stat-num mono" style={{fontSize:24}}>{pct}%</div>
            <div className="small">{passCount} / {results.length} 정답</div>
            {case31 && <Badge tone={case31.pass?'good':'danger'}>#31 핵심 케이스 {case31.pass?'통과':'실패'}</Badge>}
          </div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>#</th><th>영역</th><th>기대</th><th>실제</th><th>유사도</th><th>문장</th></tr></thead>
              <tbody>
                {results.map(r=> r.multi ? r.checks.map(ch=>(
                  <tr key={r.id+'-'+ch.domain}>
                    <td className="mono">{r.id}</td>
                    <td>{ch.label}</td>
                    <td>{ch.rule.is ? ch.rule.is : '≠ '+ch.rule.not}</td>
                    <td>{ch.pass ? <Badge tone="good">{ch.actual}</Badge> : <Badge tone="danger">{ch.actual}</Badge>}</td>
                    <td className="mono">{ch.similarity!=null?ch.similarity.toFixed(2):'-'}</td>
                    <td className="small">{r.text}</td>
                  </tr>
                )) : (
                  <tr key={r.id}>
                    <td className="mono">{r.id}</td>
                    <td>{r.label}</td>
                    <td>{r.expected}</td>
                    <td>{r.pass ? <Badge tone="good">{r.actual}</Badge> : <Badge tone="danger">{r.actual}</Badge>}</td>
                    <td className="mono">{r.similarity!=null?r.similarity.toFixed(2):'-'}</td>
                    <td className="small">{r.text}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminStats({state, setState, setNav}){
  const openSignals = state.signals.filter(s=>s.lifecycle!=='종결');
  const overdue = openSignals.filter(s=>{ if(s.deadline==='즉시') return s.lifecycle==='신규'; const du=daysUntil(s.deadline); return du!==null && du<0; });
  const closedFalse = state.signals.filter(s=>s.lifecycle==='종결' && (s.reviewNote||'').includes('오탐'));
  const byDomain = {};
  state.signals.forEach(s=>{ byDomain[s.label]=(byDomain[s.label]||0)+1; });
  const domainRows = Object.entries(byDomain).sort((a,b)=>b[1]-a[1]);
  const referralDone = state.referrals.filter(r=>r.status==='완료').length;

  // 데모 데이터 초기화 — 시연/관리자 화면 전용. 실제 운영 사용자 화면(오늘의 업무 등)에는 노출하지 않는다.
  function resetDemoData(){
    const ok = window.confirm('데모 데이터를 초기 상태로 되돌리시겠습니까? 현재 변경한 내용은 삭제됩니다.');
    if(!ok) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    setState(buildSeed());
    setNav({screen:'dashboard'});
  }

  return (
    <div>
      <div className="section-head"><h2>관리자 통계</h2></div>
      <div className="stat-grid" style={{marginBottom:24}}>
        <div className="stat-tile"><div className="stat-num mono">{openSignals.length}</div><div className="stat-label">미처리 경고</div></div>
        <div className="stat-tile"><div className="stat-num mono" style={{color:'var(--danger)'}}>{overdue.length}</div><div className="stat-label">기한초과</div></div>
        <div className="stat-tile"><div className="stat-num mono" style={{color:'var(--warn)'}}>{closedFalse.length}</div><div className="stat-label">오탐 종결</div></div>
        <div className="stat-tile"><div className="stat-num mono" style={{color:'var(--good)'}}>{referralDone}</div><div className="stat-label">연계 완료</div></div>
      </div>

      <EmbeddingAccuracyPanel/>

      <div className="card" style={{marginBottom:24}}>
        <div className="dl" style={{fontWeight:600, marginBottom:8, fontSize:13}}>데모 데이터 관리</div>
        <p className="small" style={{marginBottom:10}}>시연 중 변경한 내용을 지우고 최초 더미데이터 상태로 되돌립니다. 실제 운영 화면에는 노출되지 않는 관리자·데모 전용 기능입니다.</p>
        <button className="btn btn--sm" onClick={resetDemoData}>데모 데이터 초기화</button>
      </div>

      <div className="section-head"><h2>위험영역별 경고 추세</h2></div>
      <div className="table-wrap" style={{marginBottom:24}}>
        <table><thead><tr><th>위험영역</th><th>누적 경고 수</th></tr></thead>
          <tbody>{domainRows.map(([k,v])=>(<tr key={k}><td>{k}</td><td className="mono">{v}</td></tr>))}
            {domainRows.length===0 && <tr><td colSpan="2"><Empty>데이터가 없습니다.</Empty></td></tr>}
          </tbody>
        </table>
      </div>

      <div className="section-head"><h2>감사 이력 (최근 순)</h2></div>
      <div className="table-wrap">
        <table><thead><tr><th>시각</th><th>행위자</th><th>동작</th><th>상세</th></tr></thead>
          <tbody>
            {state.audit.slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,20).map(l=>(
              <tr key={l.id}><td className="mono small">{fmtDateTime(l.at)}</td><td>{l.actor}</td><td>{l.action}</td><td>{l.detail}</td></tr>
            ))}
            {state.audit.length===0 && <tr><td colSpan="4"><Empty>이력이 없습니다.</Empty></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================
   App 루트
   ============================================================ */
function App(){
  const [state, setState] = useState(loadState());
  const [nav, setNav] = useState({screen:'dashboard'});
  const role = '생활지원사'; // 역할 전환 UI 제거 — 항상 생활지원사 권한으로 고정
  const [query, setQuery] = useState('');
  const [currentCaseworkerId, setCurrentCaseworkerId] = useState(state.caseworkers[0].id);

  useEffect(()=>{ saveState(state); }, [state]);
  // 안부확인 화면에 들어가기 전에 로드가 끝나도록, 앱을 여는 즉시 백그라운드에서 모델을 미리 불러온다
  useEffect(()=>{ EmbeddingEngine.ensureReady().catch(()=>{}); }, []);

  function renameCaseworker(id, name){
    setState(s=>({...s, caseworkers: s.caseworkers.map(w=>w.id===id?{...w,name}:w)}));
  }

  const currentCaseworker = state.caseworkers.find(w=>w.id===currentCaseworkerId) || state.caseworkers[0];
  const visibleClientIds = useMemo(
    ()=> new Set(state.clients.filter(c=>c.managerId===currentCaseworkerId).map(c=>c.id)),
    [state.clients, currentCaseworkerId]
  );
  const scopedState = useMemo(()=>({
    ...state,
    clients: state.clients.filter(c=>visibleClientIds.has(c.id)),
    signals: state.signals.filter(s=>visibleClientIds.has(s.clientId)),
    records: state.records.filter(r=>visibleClientIds.has(r.clientId)),
  }), [state, visibleClientIds]);

  const titles = {
    dashboard:['오늘의 업무','담당자(나): '+currentCaseworker.name],
    clients:['대상자 목록', currentCaseworker.name+' 담당 대상자'],
    client:['대상자 상세','타임라인 · 평소상태 · 신호'],
    newClient:['신규 대상자 등록','기본정보 · 비상연락망 · 동의를 한 화면에서 입력'],
    baseline:['평소상태 등록','변화 비교의 기준값'],
    checkin:['안부 확인','질문추천 · 전화·방문 기록'],
    analysis:['AI 분석 검토','구조화 결과 승인·수정·기각'],
    priority:['우선확인 대시보드','긴급·당일·연계검토·추적관찰'],
    signal:['신호 상세','연계 후보 · 진행상태'],
    policies:['정책·기관 DB','부록 B 구조 기반'],
    admin:['관리자 통계','미처리·기한초과·오탐·감사이력'],
  };
  const [title, crumb] = titles[nav.screen] || ['잘한다잘한다',''];

  let body = null;
  if(nav.screen==='dashboard') body = <Dashboard state={scopedState} setNav={setNav} role={role}/>;
  else if(nav.screen==='clients') body = <ClientList state={scopedState} setNav={setNav} query={query}/>;
  else if(nav.screen==='client') body = <ClientProfile state={state} setState={setState} setNav={setNav} id={nav.params.id} role={role} currentCaseworkerId={currentCaseworkerId}/>;
  else if(nav.screen==='newClient') body = <NewClientForm state={state} setState={setState} setNav={setNav} currentCaseworkerId={currentCaseworkerId}/>;
  else if(nav.screen==='baseline') body = <BaselineForm state={state} setState={setState} setNav={setNav} clientId={nav.params.clientId} isNew={nav.params.isNew} currentCaseworkerId={currentCaseworkerId}/>;
  else if(nav.screen==='checkin') body = <CheckinForm state={state} setState={setState} setNav={setNav} clientId={nav.params.clientId} currentCaseworkerId={currentCaseworkerId} role={role}/>;
  else if(nav.screen==='analysis') body = <AnalysisReview state={state} setState={setState} setNav={setNav} recordId={nav.params.recordId} currentCaseworkerId={currentCaseworkerId}/>;
  else if(nav.screen==='priority') body = <PriorityDashboard state={scopedState} setNav={setNav}/>;
  else if(nav.screen==='signal') body = <SignalDetail state={state} setState={setState} setNav={setNav} id={nav.params.id} currentCaseworkerId={currentCaseworkerId}/>;
  else if(nav.screen==='policies') body = <PolicyDB state={state}/>;
  else if(nav.screen==='admin') body = <AdminStats state={state} setState={setState} setNav={setNav}/>;

  return (
    <div className="app-shell">
      <Sidebar nav={nav} setNav={setNav}
        caseworkers={state.caseworkers} currentCaseworkerId={currentCaseworkerId}
        setCurrentCaseworkerId={setCurrentCaseworkerId} onRenameCaseworker={renameCaseworker}/>
      <div className="main">
        <TopBar title={title} crumb={crumb} onSearch={nav.screen==='clients'?setQuery:null} query={query}/>
        <div className="content">{body}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
