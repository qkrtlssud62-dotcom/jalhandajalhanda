<style>

:root[data-theme="dark"]{

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans KR', -apple-system, sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Gowun Batang','IBM Plex Sans KR',serif;text-wrap:balance;margin:0;font-weight:700;}
.mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--teal);}
::selection{background:var(--amber-soft);}

.app-shell{display:flex;min-height:100vh;}

/* ---------- sidebar ---------- */
.sidebar{
  width:232px;flex:none;background:var(--teal-deep);color:#EFEAE0;
  display:flex;flex-direction:column;padding:20px 14px;gap:18px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;flex-direction:column;gap:3px;padding:2px 8px 10px;border-bottom:1px solid rgba(239,234,224,0.14);}
.brand-mark{font-family:'Gowun Batang',serif;font-size:19px;font-weight:700;color:#F4E3CC;line-height:1.25;}
.brand-sub{font-size:10.5px;color:#9FB9B8;letter-spacing:.04em;}
.role-switch{display:flex;flex-direction:column;gap:6px;padding:0 8px;}
.role-switch label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8FADAC;}
.role-switch select{
  background:#1F4548;border:1px solid #2F5D5F;color:#EFEAE0;border-radius:8px;padding:7px 9px;width:100%;
}
.role-switch input[type=text]{
  background:#1F4548;border:1px solid #2F5D5F;color:#EFEAE0;border-radius:8px;padding:6px 8px;width:100%;font-size:12.5px;
}
.side-btn{
  align-self:flex-start;background:transparent;border:1px solid #3C6664;color:#CBD9D6;border-radius:6px;
  padding:4px 9px;font-size:11px;cursor:pointer;
}
.side-btn:hover{border-color:#5A8482;color:#F7F1E6;}
.side-btn.primary{background:#2C5F63;border-color:#2C5F63;color:#fff;}
.side-rename{display:flex;flex-direction:column;gap:6px;}
.side-actions{display:flex;gap:6px;}
.side-hint{font-size:10px;color:#7E9997;margin:2px 0 0;line-height:1.4;}

.embed-status{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#9FB9B8;padding:8px 10px;margin-top:auto;border-top:1px solid rgba(239,234,224,0.14);}
.embed-status-dot{width:6px;height:6px;border-radius:50%;background:#9FB9B8;flex:none;}
.embed-status--good .embed-status-dot{background:#7FB587;}
.embed-status--good{color:#BFE0C4;}
.embed-status--warn .embed-status-dot{background:#E0A23C;}
.embed-status--warn{color:#EBC98A;}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  color:#CBD9D6;text-decoration:none;cursor:pointer;border:1px solid transparent;font-size:13.5px;
  background:transparent;text-align:left;width:100%;
}
.nav-item:hover{background:rgba(239,234,224,0.08);}
.nav-item.active{background:#1F4548;color:#F7F1E6;border-color:#33605F;}
.nav-ico{width:16px;text-align:center;font-size:13px;opacity:.9;}
.sidebar-foot{padding:10px 8px 0;font-size:10.5px;color:#8FADAC;}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 28px;border-bottom:1px solid var(--line);background:var(--paper-raised);
  position:sticky;top:0;z-index:5;
}
.topbar-title{display:flex;flex-direction:column;gap:2px;}
.topbar-title h1{font-size:19px;}
.topbar-crumb{font-size:11.5px;color:var(--ink-faint);}
.search-input{
  border:1px solid var(--line-strong);background:var(--paper);border-radius:9px;padding:8px 12px;
  min-width:220px;
}
.content{padding:24px 28px 60px;max-width:1180px;}

.disclaimer{
  background:var(--amber-soft);border:1px solid var(--amber);color:var(--ink);
  border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.6;margin-bottom:20px;
}

/* ---------- buttons ---------- */
.btn{
  border-radius:8px;border:1px solid var(--line-strong);background:var(--paper-raised);color:var(--ink);
  padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--teal);}
.btn--primary{background:var(--teal);border-color:var(--teal);color:#fff;}
.btn--primary:hover{background:var(--teal-deep);}
.btn--amber{background:var(--amber);border-color:var(--amber);color:#fff;}
.btn--danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn--ghost{background:transparent;border-color:transparent;}
.btn--sm{padding:5px 10px;font-size:12px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* ---------- cards / layout ---------- */
.card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);
}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:16px;}
.section-head .count{font-size:11.5px;color:var(--ink-faint);}
.two-col{display:grid;grid-template-columns:1.1fr 0.9fr;gap:18px;align-items:start;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

/* ---------- badges/chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge--danger{background:var(--danger-soft);color:var(--danger);}
.badge--warn{background:var(--warn-soft);color:var(--warn);}
.badge--info{background:var(--info-soft);color:var(--info);}
.badge--neutral{background:var(--neutral-soft);color:var(--neutral);}
.badge--good{background:var(--good-soft);color:var(--good);}
.badge--amber{background:var(--amber-soft);color:var(--amber);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}

/* ---------- priority cards ---------- */
.priority-card{
  display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper-raised);
  box-shadow:var(--shadow); cursor:pointer;
}
.priority-card:hover{border-color:var(--line-strong);}
.stripe{width:6px;flex:none;}
.stripe--danger{background:var(--danger);}
.stripe--warn{background:var(--warn);}
.stripe--info{background:var(--info);}
.stripe--neutral{background:var(--neutral);}
.stripe--good{background:var(--good);}
.pc-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:8px;}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.pc-name{font-weight:600;font-size:14.5px;}
.pc-meta{font-size:11.5px;color:var(--ink-faint);}
.pc-excerpt{font-size:12.5px;color:var(--ink-soft);background:var(--paper);border-left:3px solid var(--line-strong);padding:6px 10px;border-radius:4px;}
.pc-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-faint);}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper-raised);}
table{border-collapse:collapse;width:100%;min-width:640px;}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;background:var(--paper);}
tr:last-child td{border-bottom:none;}
tr.clickable:hover{background:var(--teal-soft);cursor:pointer;}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.field .hint{font-size:11px;color:var(--ink-faint);font-weight:400;}
.field input[type=text],.field input[type=date],.field input[type=time],.field select,.field textarea{
  border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:9px 11px;width:100%;
}
.field textarea{resize:vertical;min-height:78px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:640px){.form-grid,.form-grid.cols-3{grid-template-columns:1fr;}}
.checkline{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink-soft);}
.checkline input{margin-top:3px;}

.domain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.domain-cell{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);}
.domain-cell .dl{font-weight:600;font-size:12.5px;margin-bottom:6px;}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;}
.seg button{flex:1;border:none;background:var(--paper-raised);padding:6px 4px;font-size:11.5px;cursor:pointer;color:var(--ink-soft);border-right:1px solid var(--line-strong);}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--teal);color:#fff;}
.seg button.on.bad{background:var(--warn);}
.seg button.on.unk{background:var(--neutral);}

/* ---------- stepper ---------- */
.stepper{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.step{font-size:11.5px;padding:6px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink-faint);}
.step.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
.step.done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}

/* ---------- timeline ---------- */
.timeline{position:relative;padding-left:22px;}
.timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding-bottom:20px;}
.tl-dot{position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid var(--paper-raised);}
.tl-when{font-size:11px;color:var(--ink-faint);}
.tl-title{font-weight:600;font-size:13px;margin:2px 0 4px;}
.tl-body{font-size:12.5px;color:var(--ink-soft);}

/* ---------- stat tiles ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.stat-tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--paper-raised);}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}
.stat-label{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:28px;text-align:center;color:var(--ink-faint);font-size:13px;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:4px 10px;font-size:11.5px;border:1px solid transparent;cursor:pointer;}
.tag.off{background:var(--paper);color:var(--ink-faint);border-color:var(--line);}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink-faint);}
.locked{background:var(--paper);border:1px dashed var(--line-strong);border-radius:8px;padding:12px;font-size:12px;color:var(--ink-faint);}
.small{font-size:11.5px;color:var(--ink-faint);}
hr.rule{border:none;border-top:1px solid var(--line);margin:16px 0;}

@media(max-width:820px){
  .app-shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;align-items:center;}
  .nav{flex-direction:row;flex-wrap:wrap;}
  .sidebar-foot{display:none;}
  .content{padding:18px 16px 40px;}
  .topbar{padding:14px 16px;}
}
</style>

<!-- transformers.js는 ESM 전용 배포라 import 문법이 필요하다. 아래의 UMD+Babel-standalone 코드는
     import를 쓸 수 없으므로, 이 모듈 스크립트가 window.__tfjs로 다리를 놓는다. 두 스크립트의
     실행 순서는 보장되지 않으므로(둘 다 사실상 defer), 실행 순서에 의존하지 않고 아래에서

</script>

const DOMAINS = [
  {key:'nutrition',  label:'식사·수분',    hint:'식사량 감소, 끼니 거름, 식욕 저하, 수분 섭취',

  {key:'pain',       label:'통증·건강',    hint:'통증 발생·악화, 호흡곤란, 발열 등 건강 이상',

  {key:'fall',       label:'낙상·거동',    hint:'실제 낙상, 휘청거림, 보행 곤란, 외출 어려움',

const DOMAIN_MAP = Object.fromEntries(DOMAINS.map(d=>[d.key,d]));
/* 자살·자해·화재·학대 등 사전 정의 규칙으로 즉시 알림되는 표현 — 5개 핵심 위험영역과 별개로 항상 감지한다 */

const CASEWORKER_SEED = [
  {id:'W-1', name:'생활지원사 정○○'},

const NEG_WORDS = ['없','못','안 ','않','어렵','힘들','감소','악화','불편','깜빡','잊','넘어지','어지럼','누락','중단','거부','싫다','부족','악해','저하','곤란','장벽','의심','미룸','미루'];

/* 1글자짜리 NEG_WORDS/POS_WORDS('못','잘','잊' 등)는 다른 단어 속 글자와 우연히 겹쳐 오탐을 낸다.

   진짜 해결은 형태소 분석기로 조사·어간 경계를 인식해야 하지만, 이 데모는 키워드 매칭 수준이라 하지 않는다.
   최소한의 방어로, 알려진 오탐 문구가 함께 등장하면 그 짧은 키워드는 판정에서 제외한다.
   개선 여지: 새로운 오탐 사례를 발견할 때마다 아래 목록에 추가하거나, 장기적으로는 조사·어미를 보고
   실제 단어 경계를 판별하는 정규식(또는 형태소 분석)으로 교체할 것. */
const SHORT_WORD_EXCEPTIONS = {
  '못': ['연못'],
  '잘': ['잘리', '잘렸', '잘림', '해고'],
  '잊': ['잊지 않', '잊지않', '잊지 말', '잊지말'],
};
function includesAnyGuarded(text, words){
  return words.some(w=>{
    if(!text.includes(w)) return false;
    const exceptions = SHORT_WORD_EXCEPTIONS[w];
    if(exceptions && exceptions.some(ex=>text.includes(ex))) return false;
    return true;
  });
}

function uid(p){ return p+'-'+Math.random().toString(36).slice(2,7).toUpperCase(); }
function isoDaysFromNow(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function isoDaysAgo(n){ return isoDaysFromNow(-n); }
function fmtDate(iso){ if(!iso) return '-'; try{ return new Date(iso+'T00:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}); }catch(e){return iso;} }
function fmtDateTime(iso){ if(!iso) return '-'; try{ return new Date(iso).toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+new Date(iso).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }catch(e){return iso;} }
function daysUntil(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function includesAny(text, arr){ return arr.some(w=>text.includes(w)); }

/* 개발용 자가 테스트 — 브라우저 콘솔에서 확인 가능. 짧은 키워드 오탐 방지 가드(SHORT_WORD_EXCEPTIONS)가
   알려진 오탐 사례를 실제로 걸러내는지, 그리고 정상적인 부정·긍정 판정까지 함께 죽이지는 않는지 검증한다.
   새 오탐 사례를 발견하면 이 목록에도 케이스를 추가해서 계속 방어되는지 확인할 것. */
(function runKeywordGuardSelfTests(){
  const cases = [
    {text:'마당에 예쁜 연못이 있어요.', words:NEG_WORDS, expect:false, note:"'못' 오탐 방지 — 연못(pond)"},
    {text:'지난달에 일자리에서 잘렸다고 하심.', words:POS_WORDS, expect:false, note:"'잘' 오탐 방지 — 잘리다(해고, 부정적 사건)"},
    {text:'약 챙기는 것을 잊지 말고 잘 챙기신다고 함.', words:NEG_WORDS, expect:false, note:"'잊' 오탐 방지 — 잊지 말고(=안 잊음, 긍정)"},
    {text:'약을 못 챙기셨다고 함.', words:NEG_WORDS, expect:true, note:'정상 부정 판정 유지 — 못 챙김'},
    {text:'식사를 잘 챙기신다고 함.', words:POS_WORDS, expect:true, note:'정상 긍정 판정 유지 — 잘 챙김'},
  ];
  cases.forEach(c=>{
    const actual = includesAnyGuarded(c.text, c.words);
    console.assert(actual===c.expect, '[키워드 오탐 가드 테스트 실패] '+c.note+' → 기대 '+c.expect+', 실제 '+actual);
  });
})();

/* 문장·절 단위 분리: 마침표류 종결부호, "다고 함/하심"류 인용 종결, "는데·지만" 같은 대조 연결어에서 끊는다.
   도메인별 긍정·부정 판정을 이 단위로 국한해, 다른 영역을 설명하는 절의 부정어가 섞여 들어오지 않게 한다. */
function splitClauses(text){
  if(!text) return [];
  return text
    .split(/(?<=[.!?])\s+|(?<=(?:다고 함|라고 함|다고 하심|라고 하심|하셨다고 함|하신다고 함))\s+(?=[가-힣])|(?<=(?:는데|지만))\s*/)
    .map(s=>s.trim())
    .filter(Boolean);
}

/* 메모를 5개 핵심 위험영역으로 구조화하는 규칙기반 분석 엔진 (실제 AI 호출 대신 데모용 키워드 매칭) */
function analyzeMemo(memo, baseline){
  const text = memo || '';
  const clauses = splitClauses(text);
  const rows = DOMAINS.map(d=>{
    const hit = d.kw.find(k=>text.includes(k));
    if(!hit){
      return {domain:d.key,label:d.label,status:'미확인',content:'이번 통화·방문에서 확인되지 않음',time:'-',excerpt:'원문 없음'};
    }
    // 이 도메인 키워드가 실제로 등장한 문장(절)만 골라, 그 절 전체를 근거(excerpt)로 쓰고 긍정·부정도 그 범위에서만 판정한다
    const clause = clauses.find(c=>c.includes(hit)) || text;
    const excerpt = clause.trim();
    const neg = includesAnyGuarded(clause, NEG_WORDS);
    const pos = includesAnyGuarded(clause, POS_WORDS);
    const timeHit = TIME_WORDS.find(t=>text.includes(t.kw));
    const time = timeHit ? timeHit.label : '최근';
    let status = '미확인';
    let content = d.label+' 관련 언급';
    if(neg && !pos){ status='이상'; content=d.label+' 어려움 관찰'; }
    else if(pos && !neg){ status='정상'; content=d.label+' 양호'; }
    else if(neg && pos){ status='이상'; content=d.label+' 부분적 어려움'; }
    else { status='이상'; content=d.label+' 변화 언급'; }
    return {domain:d.key,label:d.label,status,content,time,excerpt};
  });
  const emergency = includesAny(text, EMERGENCY_WORDS);
  if(emergency){
    const hitWord = EMERGENCY_WORDS.find(w=>text.includes(w));
    const clause = clauses.find(c=>c.includes(hitWord)) || text;
    const timeHit = TIME_WORDS.find(t=>text.includes(t.kw));
    rows.push({
      domain:'emergency', label:'긴급 표현', status:'이상',
      content:'자살·자해·화재·학대 등 즉시 확인이 필요한 표현 감지',
      time: timeHit ? timeHit.label : '최근', excerpt: clause.trim(),
    });
  }
  return {rows, emergency};
}

function classifyChange(domainKey, currentStatus, baseline, priorSignalsForClient){
  const baseVal = baseline ? baseline.domains[domainKey] : '미확인';
  const priorForDomain = priorSignalsForClient.filter(s=>s.domain===domainKey);
  const lastPrior = priorForDomain[priorForDomain.length-1];
  if(currentStatus==='이상'){
    if(!lastPrior || lastPrior.currentStatus!=='이상'){
      return baseVal==='어려움' ? '반복' : '신규';
    }
    const consecutive = priorForDomain.filter(s=>s.currentStatus==='이상').length;
    return consecutive>=2 ? '악화' : '반복';
  }
  if(currentStatus==='정상' && lastPrior && lastPrior.currentStatus==='이상'){ return '호전'; }
  return '-';
}

function suggestUrgency(rows, emergency){
  if(emergency) return '긴급확인';
  const abnormal = rows.filter(r=>r.status==='이상' && r.domain!=='emergency');
  if(abnormal.some(r=>r.changeType==='신규' || r.changeType==='악화')) return '당일확인';
  if(abnormal.some(r=>r.changeType==='반복')) return '연계검토';
  if(abnormal.length>0) return '추적관찰';
  return '특이신호없음';
}

/* window.__tfjs(ESM 모듈 스크립트가 노출)가 준비될 때까지 기다린다. 두 스크립트의 실행
   순서가 보장되지 않으므로, 이미 준비돼 있으면 바로 반환하고 아니면 이벤트를 기다린다. */
function waitForTfjsLib(){
  return new Promise((resolve, reject)=>{
    if(window.__tfjs) return resolve(window.__tfjs);
    window.addEventListener('tfjs-lib-ready', ()=>resolve(window.__tfjs), {once:true});
    setTimeout(()=>{ if(!window.__tfjs) reject(new Error('transformers.js 라이브러리를 불러오지 못했습니다.')); }, 30000);
  });
}

/* 임베딩 엔진 — React 바깥의 작은 상태 저장소(pub-sub). useSyncExternalStore로 구독한다.
   상태: idle → loading-lib → loading-model(progress) → preparing-references → ready / error */
const EmbeddingEngine = (function(){
  let state = { status:'idle', progress:0, message:'', extractor:null, error:null };
  const listeners = new Set();
  function setState(patch){ state = {...state, ...patch}; listeners.forEach(fn=>fn()); }
  function subscribe(fn){ listeners.add(fn); return ()=>listeners.delete(fn); }
  function getState(){ return state; }

  const referenceEmbeddingCache = {}; // domainKey -> [{label, text, vector}]

  async function embed(text){
    // 상태 문자열이 아니라 extractor 존재 여부로 판단: 참고 예시 사전임베딩은
    // 'preparing-references' 단계(아직 'ready' 전)에서 바로 이 함수를 호출한다.
    if(!state.extractor) throw new Error('임베딩 모델이 아직 준비되지 않았습니다.');
    // 스펙: "query: " 접두어 + mean pooling + 정규화
    const output = await state.extractor('query: '+text, {pooling:'mean', normalize:true});
    return Array.from(output.data);
  }

  async function getDomainReferenceEmbeddings(domainKey){
    if(referenceEmbeddingCache[domainKey]) return referenceEmbeddingCache[domainKey];
    const ex = DOMAIN_REFERENCE_EXAMPLES[domainKey];
    const items = [];
    for(const label of ['정상','이상']){
      for(const sentence of ex[label]){
        items.push({label, text:sentence, vector: await embed(sentence)});
      }
    }
    referenceEmbeddingCache[domainKey] = items;
    return items;
  }

  let startedPromise = null;
  function ensureReady(){
    if(startedPromise) return startedPromise;
    startedPromise = (async ()=>{
      setState({status:'loading-lib', message:'분석 라이브러리 불러오는 중...'});
      const tfjs = await waitForTfjsLib();
      setState({status:'loading-model', progress:0, message:'AI 분석 모델 불러오는 중...'});
      const extractor = await tfjs.pipeline('feature-extraction', EMBEDDING_MODEL_ID, {
        progress_callback:(p)=>{
          if(p && p.status==='progress'){
            const pct = p.total ? Math.round((p.loaded/p.total)*100) : Math.round(p.progress||0);
            setState({progress:pct, message:'AI 분석 모델 불러오는 중... ('+pct+'%)'});
          }
        },
      });
      setState({status:'preparing-references', progress:100, message:'참고 예시 문장 준비 중...', extractor});
      // 매 분석마다 다시 계산하지 않도록, 5개 영역의 참고 예시를 미리 전부 임베딩해 캐시해둔다
      await Promise.all(Object.keys(DOMAIN_REFERENCE_EXAMPLES).map(getDomainReferenceEmbeddings));
      setState({status:'ready', message:''});
      return extractor;
    })().catch(err=>{
      setState({status:'error', message:'AI 분석 모델을 불러오지 못했습니다. 규칙 기반 분석으로 진행합니다.', error:String((err&&err.message)||err)});
      throw err;
    });
    return startedPromise;
  }

  async function classifyClauseByEmbedding(domainKey, clause){
    const refs = await getDomainReferenceEmbeddings(domainKey);
    const vector = await embed(clause);
    let best = null;
    for(const ref of refs){
      const score = window.__tfjs.cos_sim(vector, ref.vector);
      if(!best || score>best.score) best = {label:ref.label, score, matched:ref.text};
    }
    return best;
  }

  return { subscribe, getState, ensureReady, classifyClauseByEmbedding };
})();

/* 규칙 기반 분석기 — 기존 analyzeMemo를 그대로 감싼 폴백용 구현 (동기 실행) */
const ruleBasedAnalyzer = {
  key:'rule', label:'규칙 기반',
  classify(text){ return analyzeMemo(text); },
};

/* 임베딩 기반 분석기 — 도메인 후보는 키워드로 추리고(하이브리드), 정상/이상 판정은
   참고 예시 문장과의 코사인 유사도로 내린다. 자살·자해 등 긴급 표현 탐지는 규칙 기반과
   동일하게 결정론적 키워드 매칭을 그대로 쓴다(안전 관련 판정을 임베딩 임계값에 맡기지 않기 위함). */
const embeddingAnalyzer = {
  key:'embedding', label:'임베딩 분석(AI)',
  async classify(text){
    const clauses = splitClauses(text);
    const emergency = includesAny(text, EMERGENCY_WORDS);
    const rows = await Promise.all(DOMAINS.map(async d=>{
      const hit = d.kw.find(k=>text.includes(k));
      if(!hit){
        return {domain:d.key,label:d.label,status:'미확인',content:'이번 통화·방문에서 확인되지 않음',time:'-',excerpt:'원문 없음'};
      }
      const clause = clauses.find(c=>c.includes(hit)) || text;
      const timeHit = TIME_WORDS.find(t=>text.includes(t.kw));
      const time = timeHit ? timeHit.label : '최근';
      try{
        const best = await EmbeddingEngine.classifyClauseByEmbedding(d.key, clause);
        if(!best || best.score < EMBEDDING_THRESHOLD){
          return {domain:d.key,label:d.label,status:'미확인',
            content:d.label+' 참고 예시와의 유사도가 낮아 사람 확인이 필요함',
            time, excerpt:clause, method:'embedding', similarity:best?best.score:null};
        }
        return {domain:d.key,label:d.label,status:best.label,
          content:d.label+' '+(best.label==='이상'?'어려움 관찰':'양호')+' (임베딩 매칭)',
          time, excerpt:clause, method:'embedding', similarity:best.score};
      }catch(err){
        // 모델 호출 실패 시 이 영역만 규칙 기반으로 개별 폴백(전체 분석을 막지 않는다)
        const fallbackRow = analyzeMemo(text).rows.find(r=>r.domain===d.key);
        return {...fallbackRow, method:'rule-fallback'};
      }
    }));
    if(emergency){
      const hitWord = EMERGENCY_WORDS.find(w=>text.includes(w));
      const clause = clauses.find(c=>c.includes(hitWord)) || text;
      const timeHit = TIME_WORDS.find(t=>text.includes(t.kw));
      rows.push({domain:'emergency', label:'긴급 표현', status:'이상',
        content:'자살·자해·화재·학대 등 즉시 확인이 필요한 표현 감지',
        time: timeHit ? timeHit.label : '최근', excerpt: clause.trim(), method:'rule'});
    }
    return {rows, emergency};
  },
};

const ANALYZERS = {rule: ruleBasedAnalyzer, embedding: embeddingAnalyzer};

function useEmbeddingEngineState(){
  return useSyncExternalStore(EmbeddingEngine.subscribe, EmbeddingEngine.getState);
}

  const baselines = [
    (()=>{ const b=emptyBaseline('C-1','전담사회복지사 이○○'); DOMAINS.forEach(d=>b.domains[d.key]='정상'); b.date=isoDaysAgo(40); return b; })(),

  /* --- 시나리오 A: 은행나무 어르신 — 반복되는 작은 변화 (문서 6.5 예시 + 14장 시나리오A) --- */

    records.push(rec);
    const baseline = baselines.find(b=>b.clientId===clientId);
    const priorSignalsForClient = signals.filter(s=>s.clientId===clientId);
    const {rows, emergency} = analyzeMemo(memo, baseline);
    rows.forEach(r=>{ r.changeType = classifyChange(r.domain, r.status, baseline, priorSignalsForClient.filter(s=>s.recordId!==rec.id)); });
    const urgency = suggestUrgency(rows, emergency);
    rows.forEach(r=>{
      if(r.status==='이상' || (r.changeType && r.changeType!=='-')){
        signals.push({
          id:uid('SIG'), clientId, recordId:rec.id, domain:r.domain, label:r.label, currentStatus:r.status,
          excerpt:r.excerpt, time:r.time, changeType:r.changeType, urgency,

    pushLog(managerNameFor(clientId),'안부기록 저장', method+' 상담, 대상자 '+clientId);
    return {rec, rows, urgency};
  }

  addRecord('C-1', isoDaysAgo(9)+'T09:20:00', '전화', '요즘 입맛이 조금 없다고 하셨음. 그 외 특이사항 없음.');
  addRecord('C-1', isoDaysAgo(5)+'T09:40:00', '전화', '죽만 조금 드셨다고 함. 어제부터 입맛이 없어서 죽만 조금 드셨고, 약은 아침에 깜빡했다고 함.');
  addRecord('C-1', isoDaysAgo(1)+'T10:05:00', '방문', '전에는 경로당에 갔지만 이번 주는 한 번도 나가지 않았다고 함. 어지러워서 나가지 않았다고 하심. 식사량도 계속 줄어든 상태.');

  /* --- 시나리오 B: 소나무 어르신 — 긴급 표현 --- */
  addRecord('C-2', isoDaysAgo(20)+'T14:10:00', '전화', '특이사항 없음. 식사 잘 하시고 잠도 잘 주무신다고 함.');
  const b = addRecord('C-2', isoDaysAgo(2)+'T14:30:00', '전화', '사는 게 의미가 없고 없어지고 싶다는 말씀을 하심. 최근 부인과 사별 후 많이 외로워하심.');
  const sigEmergency = signals.find(s=>s.clientId==='C-2' && s.domain==='emergency');
  if(sigEmergency){
    sigEmergency.lifecycle='조치중';
    sigEmergency.reviewNote='자살 암시 표현으로 규칙 기반 즉시 알림. 전담사회복지사가 즉시 재연락하여 상태 확인, 109 안내 및 방문 예정.';
    pushLog('전담사회복지사 이○○','긴급 신호 즉시 확인','109/정신건강복지센터 안내, 재연락 완료');
    referrals.push({id:uid('REF'), clientId:'C-2', signalId:sigEmergency.id, policyId:'P-04', reason:'자살 암시 표현 확인, 24시간 상담채널 우선 연결',
      status:'접수', consentDate:isoDaysAgo(2), nextReviewDate:isoDaysFromNow(1), outcome:'', history:[{at:isoDaysAgo(2)+'T15:00:00', note:'109 안내 및 정신건강복지센터 연계 접수'}]});
    referrals.push({id:uid('REF'), clientId:'C-2', signalId:sigEmergency.id, policyId:'P-03', reason:'우울·고립 정서 지원을 위한 지역센터 상담 연계',
      status:'대기', consentDate:isoDaysAgo(2), nextReviewDate:isoDaysFromNow(2), outcome:'', history:[{at:isoDaysAgo(1)+'T11:00:00', note:'센터 상담 일정 조율 중'}]});
  }

  /* --- 시나리오 C: 감나무 어르신 — 오탐과 경고 종결 --- */
  addRecord('C-3', isoDaysAgo(8)+'T11:00:00', '전화', '식사 잘 하시고 큰 불편 없으시다고 함.');
  addRecord('C-3', isoDaysAgo(1)+'T11:15:00', '전화', '전화를 못 받았다는 기록. 재통화 결과 병원 진료 중이어서 통화를 못 받은 것으로 확인됨.');
  const sigFalse = signals.find(s=>s.clientId==='C-3' && s.domain==='pain');
  if(sigFalse){
    sigFalse.lifecycle='종결';
    sigFalse.urgency='특이신호없음';
    sigFalse.reviewNote='오탐·정상 일정으로 종결. 병원 진료로 인한 일시적 미응답 확인.';
    sigFalse.reviewedBy='전담사회복지사 이○○';
    sigFalse.history.push({at:isoDaysAgo(0)+'T09:00:00', note:'오탐 확인 후 종결 처리 (사유: 병원 진료 중 미응답)'});
    pushLog('전담사회복지사 이○○','경고 종결(오탐)','연락 위험 후보 - 병원 진료로 확인, 정상 일정 처리');
  }

  return {clients, caseworkers, baselines, records, signals, referrals, policies: POLICY_SEED.slice(), audit, seededAt:new Date().toISOString()};
}

const STORAGE_KEY = 'ongicheck-mvp-state-v4';
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.caseworkers) return parsed;
    }
  }catch(e){}
  const seed = buildSeed();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(seed)); }catch(e){}
  return seed;
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

    'idle':'AI 분석 모델: 대기 중',
    'loading-lib':'AI 분석 모델: 준비 중...',
    'loading-model':'AI 분석 모델: 불러오는 중'+(s.progress?' ('+s.progress+'%)':'...'),
    'preparing-references':'AI 분석 모델: 예시 문장 준비 중...',
    'ready':'AI 분석 모델: 준비 완료',
    'error':'AI 분석 모델: 사용 불가(규칙 기반 대체)',
  }[s.status] || 'AI 분석 모델';
  const tone = s.status==='ready' ? 'good' : s.status==='error' ? 'warn' : 'neutral';
  return <div className={"embed-status embed-status--"+tone}><span className="embed-status-dot"></span>{label}</div>;
}

function Sidebar({nav, setNav, caseworkers, currentCaseworkerId, setCurrentCaseworkerId, onRenameCaseworker}){
  const [renaming, setRenaming] = useState(false);
  const [draftName, setDraftName] = useState('');
  const current = caseworkers.find(w=>w.id===currentCaseworkerId) || caseworkers[0];

  function startRename(){
    setDraftName(current ? current.name : '');
    setRenaming(true);
  }
  function saveRename(){
    const name = draftName.trim();
    if(name) onRenameCaseworker(currentCaseworkerId, name);
    setRenaming(false);
  }

  return (
    <div className="sidebar">
      <div className="brand">
        <span className="brand-mark">잘한다잘한다</span>
        <span className="brand-sub">A-04 고령층 돌봄 MVP</span>
      </div>
      <div className="role-switch">
        <label>담당자(나)</label>
        <select value={currentCaseworkerId} onChange={e=>{setCurrentCaseworkerId(e.target.value); setRenaming(false);}}>
          {caseworkers.map(w=>(<option key={w.id} value={w.id}>{w.name}</option>))}
        </select>
        {!renaming ? (
          <button className="side-btn" onClick={startRename}>이름변경</button>
        ) : (
          <div className="side-rename">
            <input type="text" value={draftName} onChange={e=>setDraftName(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') saveRename(); if(e.key==='Escape') setRenaming(false); }} autoFocus/>
            <div className="side-actions">
              <button className="side-btn primary" onClick={saveRename}>저장</button>
              <button className="side-btn" onClick={()=>setRenaming(false)}>취소</button>
            </div>
          </div>
        )}
        <p className="side-hint">담당자가 바뀌면 이름만 바꿔서 이어 쓸 수 있습니다.</p>
      </div>
      <div className="nav">
        {NAV_ITEMS.map(it=>(

            <span className="nav-ico">{it.ico}</span>{it.label}

        ))}
      </div>
      <EmbeddingStatusBadge/>
      <div className="sidebar-foot">
        2026 전남광주 청년 AI 솔버톤<br/>잘한다잘한다 · v1.2 기획 기반<br/>가상 인물·더미데이터 시연용
      </div>
    </div>
  );
}

/* ============================================================
   화면 1. 오늘의 업무 (대시보드)
   ============================================================ */
function Dashboard({state, setNav, role}){
  const openSignals = state.signals.filter(s=>!['종결'].includes(s.lifecycle));
  const urgent = openSignals.filter(s=>s.urgency==='긴급확인');
  const today = openSignals.filter(s=>s.urgency==='당일확인');
  const overdue = openSignals.filter(s=>{
    if(s.deadline==='즉시') return s.lifecycle==='신규';
    const du = daysUntil(s.deadline);
    return du!==null && du<0;
  });
  const upcoming = state.records
    .map(r=>({rec:r, client:state.clients.find(c=>c.id===r.clientId)}))
    .filter(x=>x.client)
    .sort((a,b)=> (a.rec.nextCheckDate||'').localeCompare(b.rec.nextCheckDate||''))
    .slice(0,6);

  function Row({s}){
    const c = state.clients.find(cl=>cl.id===s.clientId);
    if(!c) return null;
    return (
      <tr className="clickable" onClick={()=>setNav({screen:'signal', params:{id:s.id}})}>
        <td>{c.alias}<div className="small">{c.caseNo}</div></td>
        <td>{s.label}</td>
        <td><UrgencyBadge level={s.urgency}/></td>
        <td>{s.excerpt}</td>
        <td>{s.deadline==='즉시'?'즉시':fmtDate(s.deadline)}</td>
      </tr>
    );
  }

  return (
    <div>
      <Disclaimer/>
      <div className="stat-grid" style={{marginBottom:24}}>
        <div className="stat-tile"><div className="stat-num mono" style={{color:'var(--danger)'}}>{urgent.length}</div><div className="stat-label">긴급 확인</div></div>
        <div className="stat-tile"><div className="stat-num mono" style={{color:'var(--warn)'}}>{today.length}</div><div className="stat-label">당일 확인</div></div>
        <div className="stat-tile"><div className="stat-num mono" style={{color:'var(--danger)'}}>{overdue.length}</div><div className="stat-label">처리기한 초과</div></div>
        <div className="stat-tile"><div className="stat-num mono">{state.clients.length}</div><div className="stat-label">담당 대상자</div></div>
      </div>

      <div className="section-head">
        <h2>오늘 먼저 확인할 신호</h2>
        <button className="btn btn--primary" onClick={()=>setNav({screen:'newClient'})}>+ 신규 대상자 등록</button>
      </div>
      {urgent.length+today.length+overdue.length===0 ? (
        <Empty>긴급·당일·기한초과 신호가 없습니다. 대상자 목록에서 안부 확인을 진행해 보세요.</Empty>
      ) : (
        <div className="table-wrap">
          <table>
            <thead><tr><th>대상자</th><th>위험영역</th><th>단계</th><th>발견 근거</th><th>처리기한</th></tr></thead>
            <tbody>
              {[...urgent,...today,...overdue.filter(s=>!urgent.includes(s)&&!today.includes(s))].map(s=><Row key={s.id} s={s}/>)}
            </tbody>
          </table>
        </div>
      )}

      <div className="section-head"><h2>다가오는 확인 일정</h2></div>
      <div className="table-wrap">
        <table>
          <thead><tr><th>대상자</th><th>최근 접촉</th><th>방식</th><th>다음 확인일</th><th></th></tr></thead>
          <tbody>
            {upcoming.map(x=>(
              <tr key={x.rec.id} className="clickable" onClick={()=>setNav({screen:'client', params:{id:x.client.id}})}>
                <td>{x.client.alias}</td>
                <td>{fmtDateTime(x.rec.datetime)}</td>
                <td>{x.rec.method}</td>
                <td>{fmtDate(x.rec.nextCheckDate)} <span className="small">({daysUntil(x.rec.nextCheckDate)}일 후)</span></td>
                <td><button className="btn btn--sm" onClick={e=>{e.stopPropagation(); setNav({screen:'checkin', params:{clientId:x.client.id}});}}>안부확인 시작</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================
   화면 2. 대상자 목록
   ============================================================ */
function ClientList({state, setNav, query}){
  const q = (query||'').trim();
  const filtered = state.clients.filter(c=>!q || c.alias.includes(q) || c.caseNo.includes(q));
  return (
    <div>
      <div className="section-head">
        <h2>대상자 목록</h2>
        <span className="count">{filtered.length}명</span>
      </div>
      <div className="table-wrap">
        <table>
          <thead><tr><th>대상자</th><th>사례번호</th><th>지역</th><th>담당자</th><th>최근 신호</th><th>등록일</th></tr></thead>
          <tbody>
            {filtered.map(c=>{
              const sigs = state.signals.filter(s=>s.clientId===c.id && s.lifecycle!=='종결');
              const worst = sigs.sort((a,b)=>URGENCY[a.urgency].order-URGENCY[b.urgency].order)[0];
              return (
                <tr key={c.id} className="clickable" onClick={()=>setNav({screen:'client', params:{id:c.id}})}>
                  <td>{c.alias}</td>
                  <td className="mono">{c.caseNo}</td>
                  <td>{c.region}</td>
                  <td>{(state.caseworkers.find(w=>w.id===c.managerId)||{}).name || '미배정'}</td>
                  <td>{worst ? <UrgencyBadge level={worst.urgency}/> : <Badge tone="good">특이신호없음</Badge>}</td>
                  <td>{fmtDate(c.registeredAt)}</td>
                </tr>
              );
            })}
            {filtered.length===0 && <tr><td colSpan="6"><Empty>{q ? '검색 결과가 없습니다.' : '현재 담당자에게 배정된 대상자가 없습니다.'}</Empty></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================
   화면 3. 신규 대상자 등록 마법사
   ============================================================ */
function NewClientWizard({state, setState, setNav, currentCaseworkerId}){
  const [step, setStep] = useState(0);
  const steps = ['중복 확인','기본정보','연락 설정','동의','완료'];
  const [dupQuery, setDupQuery] = useState({name:'', birthYear:'', phoneTail:'', region:''});
  const [checkedDup, setCheckedDup] = useState(false);
  const [form, setForm] = useState({alias:'', birthYear:'', gender:'여', region:'', managerId: currentCaseworkerId, caseNo: uid('2026-A04')});
  const [contact, setContact] = useState({contactPref:'전화', contactHours:'', emergencyContact:'없음'});
  const [consents, setConsents] = useState({ai:false, agency:false, relative:false});

  const dupCandidates = state.clients.filter(c=>{
    if(!dupQuery.name && !dupQuery.birthYear && !dupQuery.phoneTail) return false;
    const nameHit = dupQuery.name && c.alias.includes(dupQuery.name);
    const yearHit = dupQuery.birthYear && String(c.birthYear)===dupQuery.birthYear;
    return nameHit || yearHit;
  });

  function finish(){
    const newClient = {
      id: uid('C'), caseNo: form.caseNo, alias: form.alias || '무명 어르신', birthYear: Number(form.birthYear)||0,
      gender: form.gender, region: form.region || '미입력', managerId: form.managerId || currentCaseworkerId,
      contactPref: contact.contactPref, contactHours: contact.contactHours, emergencyContact: contact.emergencyContact,
      consents, registeredAt: isoDaysAgo(0), completeness: 100, dupChecked:true, status:'등록완료',
    };
    const newBaseline = emptyBaseline(newClient.id, '전담사회복지사 이○○');
    setState(s=>({...s, clients:[...s.clients, newClient], baselines:[...s.baselines, newBaseline],
      audit:[...s.audit, {id:uid('LOG'), at:new Date().toISOString(), actor:(state.caseworkers.find(w=>w.id===newClient.managerId)||{}).name || '생활지원사', action:'신규 대상자 등록', detail:newClient.caseNo}]}));
    setNav({screen:'baseline', params:{clientId:newClient.id, isNew:true}});
  }

  return (
    <div>
      <div className="section-head"><h2>신규 대상자 등록</h2></div>
      <div className="stepper">
        {steps.map((s,i)=>(<span key={s} className={"step"+(i===step?' active':i<step?' done':'')}>{i+1}. {s}</span>))}
      </div>

      {step===0 && (
        <div className="card" style={{maxWidth:640}}>
          <p className="small" style={{marginBottom:12}}>중복 등록으로 과거 기록과 담당이 분리되지 않도록, 완전 일치가 아닌 유사 후보를 먼저 확인합니다.</p>
          <div className="form-grid">
            <div className="field"><label>가명 또는 이름</label><input type="text" value={dupQuery.name} onChange={e=>setDupQuery({...dupQuery,name:e.target.value})}/></div>
            <div className="field"><label>출생연도</label><input type="text" placeholder="예: 1944" value={dupQuery.birthYear} onChange={e=>setDupQuery({...dupQuery,birthYear:e.target.value})}/></div>
            <div className="field"><label>전화번호 뒤 4자리</label><input type="text" value={dupQuery.phoneTail} onChange={e=>setDupQuery({...dupQuery,phoneTail:e.target.value})}/></div>
            <div className="field"><label>담당 지역</label><input type="text" value={dupQuery.region} onChange={e=>setDupQuery({...dupQuery,region:e.target.value})}/></div>
          </div>
          <hr className="rule"/>
          {dupCandidates.length>0 ? (
            <div>
              <p className="small">유사한 기존 대상자가 있습니다. 동일인이면 기존 프로필을 열어주세요.</p>
              {dupCandidates.map(c=>(
                <div key={c.id} className="kv"><span>{c.alias} · {c.birthYear}년생 · {c.region}</span>
                  <button className="btn btn--sm" onClick={()=>setNav({screen:'client', params:{id:c.id}})}>기존 프로필 열기</button></div>
              ))}
            </div>
          ) : <p className="small">유사 후보가 없습니다. 새로 등록을 진행할 수 있습니다.</p>}
          <div style={{marginTop:14, display:'flex', justifyContent:'flex-end', gap:8}}>
            <button className="btn btn--primary" onClick={()=>{setCheckedDup(true); setStep(1);}}>중복 없음 · 다음</button>
          </div>
        </div>
      )}

      {step===1 && (
        <div className="card" style={{maxWidth:640}}>
          <div className="form-grid">
            <div className="field"><label>사례번호</label><input type="text" className="mono" value={form.caseNo} readOnly/></div>
            <div className="field"><label>가명</label><input type="text" placeholder="예: 은행나무 어르신" value={form.alias} onChange={e=>setForm({...form,alias:e.target.value})}/></div>
            <div className="field"><label>출생연도</label><input type="text" value={form.birthYear} onChange={e=>setForm({...form,birthYear:e.target.value})}/></div>
            <div className="field"><label>성별</label>
              <select value={form.gender} onChange={e=>setForm({...form,gender:e.target.value})}><option>여</option><option>남</option></select>
            </div>
            <div className="field"><label>최소 위치정보(지역)</label><input type="text" placeholder="예: 광주 서구" value={form.region} onChange={e=>setForm({...form,region:e.target.value})}/></div>
            <div className="field"><label>담당자</label>
              <select value={form.managerId} onChange={e=>setForm({...form,managerId:e.target.value})}>
                {state.caseworkers.map(w=>(<option key={w.id} value={w.id}>{w.name}</option>))}
              </select>
            </div>
          </div>
          <p className="small" style={{marginTop:10}}>주민번호 전체와 불필요한 가족사는 수집하지 않습니다.</p>
          <div style={{marginTop:14, display:'flex', justifyContent:'space-between'}}>
            <button className="btn" onClick={()=>setStep(0)}>이전</button>
            <button className="btn btn--primary" onClick={()=>setStep(2)}>다음</button>
          </div>
        </div>
      )}

      {step===2 && (
        <div className="card" style={{maxWidth:640}}>
          <div className="form-grid">
            <div className="field"><label>선호 연락방법</label>
              <select value={contact.contactPref} onChange={e=>setContact({...contact,contactPref:e.target.value})}><option>전화</option><option>방문</option><option>전화·방문 병행</option></select>
            </div>
            <div className="field"><label>통화 가능 시간</label><input type="text" placeholder="예: 오전 9시~11시" value={contact.contactHours} onChange={e=>setContact({...contact,contactHours:e.target.value})}/></div>
            <div className="field"><label>비상연락 가능 여부</label>
              <select value={contact.emergencyContact} onChange={e=>setContact({...contact,emergencyContact:e.target.value})}><option>없음</option><option>있음(자녀)</option><option>있음(이웃)</option><option>있음(기타)</option></select>
            </div>
          </div>
          <p className="small" style={{marginTop:10}}>비상연락처 등록이 보호자 자동 알림을 의미하지는 않습니다.</p>
          <div style={{marginTop:14, display:'flex', justifyContent:'space-between'}}>
            <button className="btn" onClick={()=>setStep(1)}>이전</button>
            <button className="btn btn--primary" onClick={()=>setStep(3)}>다음</button>
          </div>
        </div>
      )}

      {step===3 && (
        <div className="card" style={{maxWidth:640}}>
          <p className="small" style={{marginBottom:10}}>목적별로 동의를 구분하여 저장하며, 연계 시점에 재확인하고 철회일을 관리합니다.</p>
          <label className="checkline"><input type="checkbox" checked={consents.ai} onChange={e=>setConsents({...consents,ai:e.target.checked})}/> AI 분석(기록 구조화·변화 비교) 동의</label>
          <label className="checkline"><input type="checkbox" checked={consents.agency} onChange={e=>setConsents({...consents,agency:e.target.checked})}/> 외부기관 연계(정책·서비스 의뢰) 동의</label>
          <label className="checkline"><input type="checkbox" checked={consents.relative} onChange={e=>setConsents({...consents,relative:e.target.checked})}/> 관계인 연락(보호자·이웃) 동의</label>
          <div style={{marginTop:14, display:'flex', justifyContent:'space-between'}}>
            <button className="btn" onClick={()=>setStep(2)}>이전</button>
            <button className="btn btn--primary" onClick={()=>setStep(4)}>다음</button>
          </div>
        </div>
      )}

      {step===4 && (
        <div className="card" style={{maxWidth:640}}>
          <h3 style={{marginBottom:10, fontSize:15}}>등록 내용 확인</h3>
          <div className="kv"><span className="k">사례번호</span><span className="mono">{form.caseNo}</span></div>
          <div className="kv"><span className="k">가명</span><span>{form.alias || '(미입력)'}</span></div>
          <div className="kv"><span className="k">지역 · 담당자</span><span>{form.region || '(미입력)'} · {(state.caseworkers.find(w=>w.id===form.managerId)||{}).name || '(미배정)'}</span></div>
          <div className="kv"><span className="k">연락 설정</span><span>{contact.contactPref} · {contact.contactHours || '(미입력)'}</span></div>
